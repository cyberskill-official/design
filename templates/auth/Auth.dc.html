<!DOCTYPE html>
<html lang="en">
<head>
<title>Sign in · CyberSkill</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Sign in" description="CyberSkill split sign-in — umber brand panel + form built from TextField, Switch, Button, and Alert. formState tweak: default | loading | error | invalid. Bilingual (English · Tiếng Việt)." -->
<helmet>
<script src="./ds-base.js"></script>
</helmet>
<style>
  .cs-auth-shell{min-height:100vh;font-family:var(--cs-font-family-ui);color:var(--cs-color-text-primary);background:var(--cs-color-surface-page)}
  .cs-auth-shell>main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh}
  .cs-auth-brand{position:relative;overflow:hidden;background:var(--cs-color-brand-umber);color:#FFFDF8;padding:56px 60px;display:flex;flex-direction:column;min-width:0}
  .cs-auth-form{display:grid;place-items:center;padding:40px 24px;min-width:0}
  .cs-auth-form-inner{width:min(400px,100%);max-width:100%;box-sizing:border-box}
  @media (max-width:820px){
    .cs-auth-shell>main{grid-template-columns:minmax(0,1fr)}
    .cs-auth-brand{padding:32px 24px;min-height:200px}
    .cs-auth-brand-h{font-size:28px!important}
    .cs-auth-form{padding:28px 16px}
  }
</style>
<div class="cs-auth-shell" data-theme="{{ rootTheme }}" lang="{{ langAttr }}" data-cs-element="{{ elAttr }}" data-cs-variant="{{ vaAttr }}">
  <a class="cs-skip" href="#main">{{ skipLabel }}</a>
  <main id="main">
  <sc-if value="{{ showBrand }}" hint-placeholder-val="{{ true }}">
    <div class="cs-auth-brand">
      <div class="cs-aurora-wash" style="position:absolute;inset:0;opacity:0.4"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(160deg,rgba(26,17,8,0.35),rgba(26,17,8,0.8))"></div>
      <div style="position:relative;z-index:1;display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px">
        <x-import component-from-global-scope="CyberSkillDS.Logo" size="40" hint-size="40px,40px"></x-import>CyberSkill
      </div>
      <p class="cs-auth-brand-h" style="position:relative;z-index:1;font-size:40px;font-weight:800;letter-spacing:-0.02em;line-height:1.08;color:var(--cs-accent-bright);margin:auto 0 8px">{{ brandH }}</p>
      <p style="position:relative;z-index:1;font-size:17px;opacity:0.9;margin:0;max-width:420px">{{ brandP }}</p>
    </div>
  </sc-if>
  <div class="cs-auth-form">
    <div class="cs-auth-form-inner">
      <h1 style="font-size:30px;font-weight:800;letter-spacing:-0.02em;margin:0 0 4px">{{ title }}</h1>
      <p style="color:var(--cs-color-text-muted);margin:0 0 28px">{{ sub }}</p>
      <div style="display:grid;gap:16px">
        <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
          <x-import component-from-global-scope="CyberSkillDS.Alert" variant="danger" title="{{ errTitle }}" hint-size="100%,64px">{{ errBody }}</x-import>
        </sc-if>
        <x-import component-from-global-scope="CyberSkillDS.TextField" label="{{ emailL }}" type="email" placeholder="you@cyberskill.world" error="{{ emailError }}" hint-size="100%,74px"></x-import>
        <x-import component-from-global-scope="CyberSkillDS.TextField" label="{{ pwL }}" type="password" placeholder="••••••••" hint-size="100%,74px"></x-import>
        <x-import component-from-global-scope="CyberSkillDS.Switch" label="{{ rememberL }}" checked="{{ false }}" hint-size="140px,26px"></x-import>
        <x-import component-from-global-scope="CyberSkillDS.Button" variant="primary" full-width="{{ true }}" loading="{{ isLoading }}" hint-size="100%,44px">{{ signInBtn }}</x-import>
        <x-import component-from-global-scope="CyberSkillDS.Button" variant="ghost" full-width="{{ true }}" hint-size="100%,44px">{{ lumiBtn }}</x-import>
      </div>
      <p style="text-align:center;font-size:13px;color:var(--cs-color-text-muted);margin-top:16px">{{ newHere }} <a class="cs-touch-target" href="#">{{ askAccess }}</a></p>
      <p style="text-align:center;font-size:12px;color:var(--cs-color-text-muted);margin-top:8px">{{ resetHint }} <a class="cs-touch-target" href="mailto:admin@cyberskill.world?subject=Password%20reset">{{ resetLink }}</a></p>
    </div>
  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-content-schema="./content-schema.json" data-props="{
  &quot;language&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;English&quot;,&quot;Tiếng Việt&quot;],&quot;default&quot;:&quot;English&quot;,&quot;tsType&quot;:&quot;\&quot;English\&quot; | \&quot;Tiếng Việt\&quot;&quot;,&quot;section&quot;:&quot;Content&quot;},
  &quot;element&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Thổ · studio&quot;,&quot;Thổ · clay&quot;,&quot;Thổ · sand&quot;,&quot;Hỏa · ember&quot;,&quot;Hỏa · lava&quot;,&quot;Hỏa · plasma&quot;,&quot;Thủy · river&quot;,&quot;Thủy · ocean&quot;,&quot;Thủy · mist&quot;,&quot;Mộc · leaf&quot;,&quot;Mộc · bamboo&quot;,&quot;Mộc · forest&quot;,&quot;Kim · champagne&quot;,&quot;Kim · steel&quot;,&quot;Kim · titanium&quot;],&quot;default&quot;:&quot;Thổ · studio&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Element (Ngũ Hành)&quot;},
  &quot;theme&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;\&quot;light\&quot; | \&quot;dark\&quot;&quot;,&quot;section&quot;:&quot;Theme&quot;},
  &quot;showBrandPanel&quot;: {&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},
  &quot;formState&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;loading&quot;,&quot;error&quot;,&quot;invalid&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;\&quot;default\&quot; | \&quot;loading\&quot; | \&quot;error\&quot; | \&quot;invalid\&quot;&quot;,&quot;section&quot;:&quot;Form states&quot;}
}">
class Component extends DCLogic {
  renderVals() {
    const EL = /* @generated template-literal:axis.element-map */ {"Thổ · studio":["tho",""],"Thổ · clay":["tho","clay"],"Thổ · sand":["tho","sand"],"Hỏa · ember":["hoa",""],"Hỏa · lava":["hoa","lava"],"Hỏa · plasma":["hoa","plasma"],"Thủy · river":["thuy",""],"Thủy · ocean":["thuy","ocean"],"Thủy · mist":["thuy","mist"],"Mộc · leaf":["moc",""],"Mộc · bamboo":["moc","bamboo"],"Mộc · forest":["moc","forest"],"Kim · champagne":["kim",""],"Kim · steel":["kim","steel"],"Kim · titanium":["kim","titanium"]} /* @endgenerated template-literal:axis.element-map */;
    const [elAttr, vaAttr] = EL[this.props.element] || EL["Thổ · studio"];
    const vn = this.props.language === "Tiếng Việt";
    const state = this.props.formState || "default";
    const en = { skipLabel:/* @generated template-literal:copy.skip-to-content.en */ "Skip to content" /* @endgenerated template-literal:copy.skip-to-content.en */, brandH:/* @generated template-literal:copy.turn-your-will-into-real.en */ "Turn Your Will Into Real" /* @endgenerated template-literal:copy.turn-your-will-into-real.en */, brandP:/* @generated template-literal:dictionary.en.6272616e6450 */ "Sign in to your workspace — one page, three lenses across every wish in flight." /* @endgenerated template-literal:dictionary.en.6272616e6450 */, title:/* @generated template-literal:dictionary.en.7469746c65 */ "Sign in" /* @endgenerated template-literal:dictionary.en.7469746c65 */, sub:/* @generated template-literal:dictionary.en.737562 */ "Welcome back. Sign in to continue." /* @endgenerated template-literal:dictionary.en.737562 */, emailL:/* @generated template-literal:copy.work-email.en */ "Work email" /* @endgenerated template-literal:copy.work-email.en */, pwL:/* @generated template-literal:dictionary.en.70774c */ "Password" /* @endgenerated template-literal:dictionary.en.70774c */, rememberL:/* @generated template-literal:dictionary.en.72656d656d6265724c */ "Remember me" /* @endgenerated template-literal:dictionary.en.72656d656d6265724c */, signInBtn: state === "loading" ? "Signing in…" : "Sign in", lumiBtn:/* @generated template-literal:dictionary.en.6c756d6942746e */ "✦ Talk to Lumi instead" /* @endgenerated template-literal:dictionary.en.6c756d6942746e */, newHere:/* @generated template-literal:dictionary.en.6e657748657265 */ "New here?" /* @endgenerated template-literal:dictionary.en.6e657748657265 */, askAccess:/* @generated template-literal:dictionary.en.61736b416363657373 */ "Ask for access" /* @endgenerated template-literal:dictionary.en.61736b416363657373 */, resetHint:/* @generated template-literal:dictionary.en.726573657448696e74 */ "Forgot password?" /* @endgenerated template-literal:dictionary.en.726573657448696e74 */, resetLink:/* @generated template-literal:dictionary.en.72657365744c696e6b */ "Email your workspace admin to reset." /* @endgenerated template-literal:dictionary.en.72657365744c696e6b */, errTitle:/* @generated template-literal:dictionary.en.6572725469746c65 */ "Sign-in failed" /* @endgenerated template-literal:dictionary.en.6572725469746c65 */, errBody:/* @generated template-literal:dictionary.en.657272426f6479 */ "Check your email and password, then try again." /* @endgenerated template-literal:dictionary.en.657272426f6479 */, emailErr:/* @generated template-literal:dictionary.en.656d61696c457272 */ "Enter a valid work email." /* @endgenerated template-literal:dictionary.en.656d61696c457272 */ };
    const vi = { skipLabel:/* @generated template-literal:copy.skip-to-content.vi */ "Bỏ qua nội dung" /* @endgenerated template-literal:copy.skip-to-content.vi */, brandH:/* @generated template-literal:copy.turn-your-will-into-real.vi */ "Hiện Thực Hoá Ý Chí" /* @endgenerated template-literal:copy.turn-your-will-into-real.vi */, brandP:/* @generated template-literal:dictionary.vi.6272616e6450 */ "Đăng nhập vào không gian làm việc — một trang, ba lăng kính cho mọi điều ước đang chạy." /* @endgenerated template-literal:dictionary.vi.6272616e6450 */, title:/* @generated template-literal:dictionary.vi.7469746c65 */ "Đăng nhập" /* @endgenerated template-literal:dictionary.vi.7469746c65 */, sub:/* @generated template-literal:dictionary.vi.737562 */ "Mừng bạn quay lại. Đăng nhập để tiếp tục." /* @endgenerated template-literal:dictionary.vi.737562 */, emailL:/* @generated template-literal:copy.work-email.vi */ "Email công việc" /* @endgenerated template-literal:copy.work-email.vi */, pwL:/* @generated template-literal:dictionary.vi.70774c */ "Mật khẩu" /* @endgenerated template-literal:dictionary.vi.70774c */, rememberL:/* @generated template-literal:dictionary.vi.72656d656d6265724c */ "Ghi nhớ đăng nhập" /* @endgenerated template-literal:dictionary.vi.72656d656d6265724c */, signInBtn: state === "loading" ? "Đang đăng nhập…" : "Đăng nhập", lumiBtn:/* @generated template-literal:dictionary.vi.6c756d6942746e */ "✦ Trò chuyện với Lumi" /* @endgenerated template-literal:dictionary.vi.6c756d6942746e */, newHere:/* @generated template-literal:dictionary.vi.6e657748657265 */ "Lần đầu?" /* @endgenerated template-literal:dictionary.vi.6e657748657265 */, askAccess:/* @generated template-literal:dictionary.vi.61736b416363657373 */ "Xin quyền truy cập" /* @endgenerated template-literal:dictionary.vi.61736b416363657373 */, resetHint:/* @generated template-literal:dictionary.vi.726573657448696e74 */ "Quên mật khẩu?" /* @endgenerated template-literal:dictionary.vi.726573657448696e74 */, resetLink:/* @generated template-literal:dictionary.vi.72657365744c696e6b */ "Gửi email cho quản trị không gian làm việc để đặt lại." /* @endgenerated template-literal:dictionary.vi.72657365744c696e6b */, errTitle:/* @generated template-literal:dictionary.vi.6572725469746c65 */ "Đăng nhập thất bại" /* @endgenerated template-literal:dictionary.vi.6572725469746c65 */, errBody:/* @generated template-literal:dictionary.vi.657272426f6479 */ "Kiểm tra email và mật khẩu, rồi thử lại." /* @endgenerated template-literal:dictionary.vi.657272426f6479 */, emailErr:/* @generated template-literal:dictionary.vi.656d61696c457272 */ "Nhập email công việc hợp lệ." /* @endgenerated template-literal:dictionary.vi.656d61696c457272 */ };
    const copy = vn ? vi : en;
    return Object.assign({
      langAttr: (this.props.language ?? "English") === "Tiếng Việt" ? "vi" : "en",
      elAttr, vaAttr,
      rootTheme: this.props.theme === "dark" ? "dark" : "",
      showBrand: this.props.showBrandPanel ?? true,
      showError: state === "error",
      isLoading: state === "loading",
      emailError: state === "invalid" ? copy.emailErr : "",
      errTitle: copy.errTitle,
      errBody: copy.errBody
    }, copy);
  }
}
</script>
</body>
</html>
