<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberSkill — AI cluster demo</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--cs-font-family-ui);background:var(--cs-color-surface-page);color:var(--cs-color-text-primary);padding:24px;max-width:720px}
  h1{font-size:18px;margin:0 0 8px} .sub{color:var(--cs-color-text-muted);font-size:13px;line-height:1.5;margin:0 0 18px}
  #root{display:grid;gap:14px}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head><body data-cs-element="tho" data-cs-style="liquid-glass">
<h1>AI cluster demo</h1>
<p class="sub">End-to-end productization story for Lumi AI surfaces: disclosure, confidence, citations, chat message, prompt input. Axes: Theme × Element × Language × Style (parent frame may post <code>__cs_axes</code>).</p>
<div id="root"></div>
<script>
const NS=window[Object.keys(window).find(k=>/^CyberSkillDesignSystem_[0-9a-f]{6}$/.test(k))];
const h=React.createElement;
function App(){
  const [lang,setLang]=React.useState('en');
  React.useEffect(()=>{
    const on=e=>{const d=e.data||{}; if(d.type==='__cs_axes'){
      const root=document.documentElement;
      if(d.theme!==undefined){ if(d.theme) root.setAttribute('data-theme', d.theme); else root.removeAttribute('data-theme'); }
      if(d.element!==undefined){ if(d.element) root.setAttribute('data-cs-element', d.element); else root.removeAttribute('data-cs-element'); }
      if(d.variant!==undefined){ if(d.variant) root.setAttribute('data-cs-variant', d.variant); else root.removeAttribute('data-cs-variant'); }
      if(d.style!==undefined){ if(d.style) root.setAttribute('data-cs-style', d.style); else root.removeAttribute('data-cs-style'); }
      if(d.lang){ setLang(d.lang); root.setAttribute('lang', d.lang); }
    }};
    window.addEventListener('message',on); return ()=>window.removeEventListener('message',on);
  },[]);
  if(!NS) return h('p',null,'Bundle missing');
  const {AIDisclosureBadge,ConfidenceMeter,CitationList,ChatMessage,PromptInput,PromptSuggestions,TypingIndicator,HumanReviewGate}=NS;
  const vi=lang==='vi';
  return h('div',{id:'cluster',lang},
    AIDisclosureBadge?h(AIDisclosureBadge,{
      label: vi?'Có hỗ trợ AI':'AI assisted',
      details: vi?'Bản nháp do Lumi tạo, đội ngũ đã xem.':'Draft generated by Lumi, reviewed by the team.',
      sources:['SKILL.md','llms.txt']
    }):null,
    ConfidenceMeter?h(ConfidenceMeter,{value:0.82,lang}):null,
    CitationList?h(CitationList,{items:[{title:'SKILL.md',href:'#skill'},{title:'llms.txt',href:'#llms'}]}):null,
    ChatMessage?h(ChatMessage,{role:'lumi',children: vi?'Xin chào — Lumi sẵn sàng.':'Hello — Lumi is ready.'}):null,
    TypingIndicator?h(TypingIndicator):null,
    PromptSuggestions?h(PromptSuggestions,{
      suggestions: vi?['Tóm tắt ticket','Soạn email']:['Summarise ticket','Draft email'],
      onSelect:()=>{}
    }):null,
    PromptInput?h(PromptInput,{placeholder: vi?'Hỏi Lumi…':'Ask Lumi…'}):null,
    HumanReviewGate?h(HumanReviewGate,{
      risk: vi?'Rủi ro cao · thay đổi billing':'High-stakes · billing change',
      summary: vi?'Lumi đề xuất chuyển gói năm và hoàn tiền theo tỉ lệ.':'Lumi proposes moving to the annual plan and issuing a prorated credit.',
      reviewer: vi?'Ops trực ca':'Ops on call'
    }):null
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body></html>
