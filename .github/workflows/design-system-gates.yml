name: Design System Gates
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch: {}
  schedule:
    # Nightly deep path (same whole-set job also runs on every PR — owner decision B).
    - cron: '0 3 * * *'

permissions:
  contents: read

# FIND-089 — cancel superseded PR/push runs; serialize write-capable paths separately.
concurrency:
  group: design-system-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Reusable Node + Playwright install (browser cache).
# Jobs below copy the same steps so each job stays self-contained.

jobs:
  fast-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the repo statically
        run: npx --yes serve@14.2.6 -l 8080 . &
      - name: Wait for server
        run: npx --yes wait-on@7.2.0 http://127.0.0.1:8080/dashboard.html
      - name: Playwright pixel compare (hard — feeds board Pixel CI row)
        run: node _audit/ci/pixel-diff.mjs http://127.0.0.1:8080
      - name: Run the fast gate board (headless)
        run: node _audit/ci/run-gates.mjs http://127.0.0.1:8080/_audit/run.html
      - name: Upload import report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with: { name: import-report, path: _audit/ci/import-report.txt }

  token-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fast-gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
      - name: Verify tokens/native/ is in lockstep with tokens.dtcg.json (fast, no browser)
        run: node _audit/ci/check-token-provenance.mjs

  unit-tests:
    # npm run test:unit — plain-Node contract tests (nav model, health/tokens UI,
    # form paths, Storybook contract, Figma helpers, Code Connect helpers, native samples)
    # plus subtree-consume (Playwright Chromium smoke for the portable copy).
    # Wired into CI by the Jul 2026 hardening (previously local-only).
    # Storybook freshness runs in storybook-build (FIND-074/075), not here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        run: npm run test:unit

  node-prechecks:
    # Browser-free Node gates that the run.html board does not own:
    #   • bundle freshness — the Node script is the source of truth (it also
    #     discovers NEW source files; the board's bundle-freshness row only
    #     re-hashes files already recorded in the bundle header)
    #   • DESIGN.md freshness — byte-identical regeneration from DTCG + manifest
    #   • dist/styles.min.css + contrast-report freshness (FIND-026)
    #   • _ds_manifest.json templates/cards/startingPoints coverage (FIND-078)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install npm dependencies (esbuild needed by the bundle checker)
        run: npm ci
      - name: _ds_bundle.js built from current sources
        run: node _audit/ci/check-bundle-freshness.mjs
      - name: DESIGN.md is a fresh regeneration
        run: node scripts/generate-design-md.mjs --check
      - name: dist/styles.min.css is a fresh flatten
        run: node scripts/flatten-styles.mjs --check
      - name: contrast-report.md is a fresh regeneration
        run: node scripts/generate-contrast-report.mjs --check
      - name: _ds_manifest.json covers shipped templates/cards/startingPoints
        run: node _audit/ci/check-manifest-coverage.mjs

  storybook-build:
    # FIND-074 / FIND-075 — build Storybook in CI; freshness gate can fail for real.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Build Storybook (+ freshness stamp)
        run: npm run build:storybook
      - name: Storybook static freshness (--require)
        run: node _audit/ci/test-storybook-freshness.mjs --require

  docs-consistency-blocker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: fast-gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the repo statically
        run: npx --yes serve@14.2.6 -l 8080 . &
      - name: Wait for server
        run: npx --yes wait-on@7.2.0 http://127.0.0.1:8080/dashboard.html
      - name: docs-consistency must be green to merge
        run: node _audit/ci/run-single-gate.mjs http://127.0.0.1:8080/_audit/docs-consistency.html __docs
      - name: bilingual-parity must be green to merge
        run: node _audit/ci/run-single-gate.mjs http://127.0.0.1:8080/_audit/bilingual-parity.html __bilingual

  whole-set-audits:
    # Owner decision B: every push/PR + nightly + manual. ~15–20 min wall time.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the repo statically
        run: npx --yes serve@14.2.6 -l 8080 . &
      - name: Wait for server
        run: npx --yes wait-on@7.2.0 http://127.0.0.1:8080/dashboard.html
      - name: responsive-overflow (all 84 templates)
        run: node _audit/ci/run-single-gate.mjs http://127.0.0.1:8080/_audit/responsive-overflow.html __overflow 360000
      - name: language-overflow (all 84 templates, forced VN)
        run: node _audit/ci/run-single-gate.mjs http://127.0.0.1:8080/_audit/language-overflow.html __language 360000
      - name: theme-overflow (all 84 templates, forced dark — overflow + contrast hard; REVIEWED_OK allowlist)
        run: node _audit/ci/run-single-gate.mjs http://127.0.0.1:8080/_audit/theme-overflow.html __theme 360000

  pixel-diff:
    # Hard gate: % drift above threshold fails the job (and blocks merge).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the repo statically
        run: npx --yes serve@14.2.6 -l 8080 . &
      - name: Wait for server
        run: npx --yes wait-on@7.2.0 http://127.0.0.1:8080/dashboard.html
      - name: Playwright pixel compare (hard)
        run: node _audit/ci/pixel-diff.mjs http://127.0.0.1:8080
      - name: Upload pixel-diff report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pixel-diff-report
          path: _audit/ci/pixel-diff-report.json
          if-no-files-found: ignore
      - name: Refresh baselines from this runner (on drift)
        if: failure()
        run: node _audit/ci/pixel-diff.mjs --update http://127.0.0.1:8080
      - name: Upload Linux baselines (on drift)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pixel-baselines-linux
          path: _audit/baselines/*.png
          if-no-files-found: ignore

  regenerate-tokens:
    # PR path — fail-closed. Same path filter + regenerate as the push twin, but the
    # job never pushes and never asks for contents: write; drift is the contributor's
    # job to fix locally. Auto-commit lives in regenerate-tokens-push below.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
      - name: Detect token-related path changes
        id: filter
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA — always regenerate."
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -E '^(tokens/element-seeds\.json|tokens/elements\.css|tokens/tokens\.json|tokens/tokens\.js|tokens/tokens\.dtcg\.json|tokens/native/|scripts/generate-element-packs\.mjs|scripts/lib/oklch\.mjs|_audit/ci/generate-native-tokens\.mjs|VERSION)$' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Token-related paths changed."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No token-related path changes — skip regenerate."
          fi
      - name: Regenerate element packs from seeds + native mirrors from DTCG
        if: steps.filter.outputs.run == 'true'
        run: |
          npm run tokens:elements
          node _audit/ci/generate-native-tokens.mjs
      - name: Fail when committed packs or natives drift
        if: steps.filter.outputs.run == 'true'
        run: |
          TRACKED='tokens/elements.css tokens/tokens.json tokens/tokens.js tokens/tokens.dtcg.json tokens/native tokens/provenance.json'
          if git diff --quiet -- $TRACKED; then
            echo "Element packs + native tokens already match seeds/DTCG — nothing to regenerate."
            exit 0
          fi
          git --no-pager diff --stat -- $TRACKED
          echo "::error::Element packs and/or natives are stale. Run 'npm run tokens:elements && node _audit/ci/generate-native-tokens.mjs' locally and commit — pull request runs never push."
          exit 1

  regenerate-tokens-push:
    # Auto-commit path — main pushes, nightly schedule, manual dispatch only.
    # Deterministic output → no-op commit when clean.
    # FIND-089 / FIND-130 — serialize with version.yml (both push to main).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: design-system-version
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.PUSH_TOKEN || github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
      - name: Detect token-related path changes
        id: filter
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA — always regenerate."
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -E '^(tokens/element-seeds\.json|tokens/elements\.css|tokens/tokens\.json|tokens/tokens\.js|tokens/tokens\.dtcg\.json|tokens/native/|scripts/generate-element-packs\.mjs|scripts/lib/oklch\.mjs|_audit/ci/generate-native-tokens\.mjs|VERSION)$' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Token-related paths changed."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No token-related path changes — skip regenerate."
          fi
      - name: Regenerate element packs from seeds + native mirrors from DTCG
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.run == 'true'
        run: |
          npm run tokens:elements
          node _audit/ci/generate-native-tokens.mjs
      - name: Check for generated drift
        id: drift
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.run == 'true'
        run: |
          TRACKED='tokens/elements.css tokens/tokens.json tokens/tokens.js tokens/tokens.dtcg.json tokens/native tokens/provenance.json'
          if git diff --quiet -- $TRACKED; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Element packs + natives already match seeds/DTCG — nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- $TRACKED
          fi
      - name: Commit regenerated files if they changed
        if: steps.drift.outputs.changed == 'true'
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          npm run tokens:elements
          node _audit/ci/generate-native-tokens.mjs
          TRACKED='tokens/elements.css tokens/tokens.json tokens/tokens.js tokens/tokens.dtcg.json tokens/native tokens/provenance.json'
          if git diff --quiet -- $TRACKED; then
            echo "After sync, packs + natives already match remote — nothing to push."
            exit 0
          fi
          git add tokens/elements.css tokens/tokens.json tokens/tokens.js tokens/tokens.dtcg.json \
            tokens/native/CSTokens.swift tokens/native/CSTokens.kt tokens/native/cs_tokens.dart tokens/provenance.json
          # No [skip ci]: the pushed tip must re-enter the gate board (FIND-021 / TASK-IMP-008).
          # Deterministic regen → second run is a no-op commit (same loop-safety idea as version.yml).
          git commit -m "chore: regenerate element packs + tokens/native/* from seeds/DTCG"
          if git push origin "HEAD:$BRANCH"; then
            echo "Pushed regenerated packs/natives to ${BRANCH}." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Token regenerate commit NOT pushed"
              echo "Push to \`${BRANCH}\` was rejected (branch protection / token scope)."
              echo "Set repository secret \`PUSH_TOKEN\` (contents:write) — same pattern as \`version.yml\`."
              echo "Or commit locally: \`npm run tokens:elements && node _audit/ci/generate-native-tokens.mjs\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Token regenerate commit blocked by branch protection — not pushed."
            # Soft-exit: content drift is still enforced by token-provenance / fast-gates.
            exit 0
          fi

  figma-variables-push:
    # Soft-skips when secrets missing (same honesty as Code Connect) or Variables API is
    # Enterprise-only (owner decision A: non-Enterprise for now). Soft-skip ≠ live sync.
    # FIND-095 — soft-skip emits step summary + ::error:: on main (not silent green).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
      - name: Check Figma secrets (soft-skip when empty)
        id: figma_secrets
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: |
          missing=0
          if [ -z "$FIGMA_TOKEN" ]; then
            echo "FIGMA_TOKEN: empty"
            missing=1
          else
            echo "FIGMA_TOKEN: present (length ${#FIGMA_TOKEN}, value not printed)"
          fi
          if [ -z "$FIGMA_FILE_KEY" ]; then
            echo "FIGMA_FILE_KEY: empty"
            missing=1
          else
            echo "FIGMA_FILE_KEY: present (length ${#FIGMA_FILE_KEY}, value not printed)"
          fi
          if [ "$missing" -ne 0 ]; then
            echo "SOFT SKIP — FIGMA_TOKEN and/or FIGMA_FILE_KEY empty; no Variables push attempted."
            echo "Same honesty as Code Connect: missing secrets exit 0 (not a live sync)."
            echo "Add repository secrets FIGMA_TOKEN and FIGMA_FILE_KEY when ready. See docs/figma.md."
            printf '%s\n' '{"skipped":true,"reason":"missing_secrets","message":"FIGMA_TOKEN and/or FIGMA_FILE_KEY empty — no Variables push attempted.","channel":"figma-variables"}' > _audit/ci/figma-push-report.json
            node _audit/ci/ci-verdict.mjs --assert-report _audit/ci/figma-push-report.json
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Dry-run colour token plan
        run: node _audit/ci/push-figma-variables.mjs --dry-run
      - name: Push colour variables to Figma
        if: steps.figma_secrets.outputs.ready == 'true'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: node _audit/ci/push-figma-variables.mjs
      - name: Soft-skip honesty annotation (FIND-095)
        if: always() && steps.figma_secrets.outputs.ready == 'false'
        run: node _audit/ci/ci-verdict.mjs --assert-report _audit/ci/figma-push-report.json
      - name: Upload Figma push report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: figma-push-report
          path: _audit/ci/figma-push-report.json
          if-no-files-found: ignore

  code-connect:
    # Decision 1C: live Code Connect path; soft-skip when secrets missing or API 403/404/429.
    # FIND-095 — soft-skip writes GITHUB_STEP_SUMMARY + distinct CI annotations.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Code Connect dry-run (config + 99 mappings, no secrets)
        run: node _audit/ci/code-connect-publish.mjs --dry-run
      - name: Code Connect publish (soft-skip without secrets / on 403·404·429)
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: node _audit/ci/code-connect-publish.mjs
      - name: Soft-skip honesty annotation (FIND-095)
        if: always()
        run: |
          if [ -f _audit/ci/code-connect-report.json ]; then
            node _audit/ci/ci-verdict.mjs --assert-report _audit/ci/code-connect-report.json
          fi
      - name: Upload Code Connect report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: code-connect-report
          path: _audit/ci/code-connect-report.json
          if-no-files-found: ignore

  npm-hello-smoke:
    # Fail-closed registry consumer proof for public @cyberskill/design@VERSION (FIND-087).
    # Missing registry VERSION → job FAIL (not soft-skip). Optional local-pack proof only
    # when repo variable NPM_HELLO_ALLOW_LOCAL_PACK=true on a fork (not cyberskill-official/design).
    # Path-filtered on push/PR; always on schedule / workflow_dispatch.
    # FIND-095 — local-pack path annotates distinctly from registry success.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Detect npm-hello / package-export path changes
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA — always run npm-hello smoke."
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -E '^(examples/npm-hello/|package\.json|package-lock\.json|_esm/|_ds_bundle\.js|styles\.css|\.github/workflows/design-system-gates\.yml)' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "npm-hello / package-export paths changed."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No npm-hello-related path changes — skip smoke."
          fi
      - name: Registry consumer smoke (examples/npm-hello)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.run == 'true'
        env:
          NPM_HELLO_ALLOW_LOCAL_PACK: ${{ vars.NPM_HELLO_ALLOW_LOCAL_PACK || '' }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        working-directory: examples/npm-hello
        run: |
          set -euo pipefail
          EXPECTED="$(tr -d '[:space:]' < ../../VERSION)"
          if npm view "@cyberskill/design@${EXPECTED}" version >/dev/null 2>&1; then
            echo "Registry has @cyberskill/design@${EXPECTED} — npm install from registry."
            npm install
            {
              echo "### Live success"
              echo ""
              echo "**npm-hello-smoke:** \`SUCCESS\` — registry @cyberskill/design@${EXPECTED}"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=SUCCESS::npm-hello-smoke registry install @${EXPECTED}"
          else
            # Fail-closed on the canonical repo (FIND-087). Local-pack proof is fork opt-in only.
            if [ "${NPM_HELLO_ALLOW_LOCAL_PACK}" = "true" ] && [ "${GITHUB_REPOSITORY_NAME}" != "cyberskill-official/design" ]; then
              echo "Fork opt-in NPM_HELLO_ALLOW_LOCAL_PACK — proving local npm pack (≠ published)."
              npm pack ../.. --pack-destination .
              TARBALL="$(ls -1 cyberskill-design-*.tgz | head -1)"
              npm install "./${TARBALL}" --no-save
              rm -f "./${TARBALL}"
              {
                echo "### Local-pack proof (not registry)"
                echo ""
                echo "**npm-hello-smoke:** \`LOCAL-PACK\` — @cyberskill/design@${EXPECTED} not on registry"
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=LOCAL-PACK::npm-hello-smoke used local pack (≠ registry) for @${EXPECTED}"
            else
              echo "::error::FAIL — @cyberskill/design@${EXPECTED} is not on the npm registry. npm-hello-smoke is fail-closed (FIND-087). Publish ${EXPECTED} via npm-publish.yml (operator-gated), or set repo variable NPM_HELLO_ALLOW_LOCAL_PACK=true on a fork only."
              exit 1
            fi
          fi
          npm run smoke

  # Area 27 / TASK-IMP-020 / FIND-108 — surface nightly failures for ALL scheduled jobs
  notify-schedule-failure:
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      contains(needs.*.result, 'failure')
    needs:
      - fast-gates
      - token-provenance
      - unit-tests
      - node-prechecks
      - storybook-build
      - docs-consistency-blocker
      - whole-set-audits
      - pixel-diff
      - regenerate-tokens-push
      - npm-hello-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Annotate nightly failure
        run: |
          echo "::error::Nightly design-system-gates schedule failed. Open https://github.com/${{ github.repository }}/actions and re-run via workflow_dispatch after triage. See docs/release-runbook.md."
          exit 1
