name: Site (design.cyberskill.world)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run site:build
      # The 2.x docs and Storybook, frozen at 2.9.0, served at /legacy/. Built once from the v2.9.0 tag with a /legacy/
      # asset base and attached to that release, so this job never has to install or build 2.x.
      - name: 2.x docs at /legacy/
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release download v2.9.0 --repo "$GITHUB_REPOSITORY" --pattern design-2.9.0-legacy-site.zip --dir "$RUNNER_TEMP"
          mkdir -p apps/site/out/legacy
          unzip -q "$RUNNER_TEMP/design-2.9.0-legacy-site.zip" -d apps/site/out/legacy
          test -f apps/site/out/legacy/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with: { path: apps/site/out }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions: # only the deploy job can write to Pages
      pages: write
      id-token: write
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
