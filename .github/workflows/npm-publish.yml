# Exact-tag validation only on release events. Publication requires explicit manual evidence review.
name: npm Publish (OIDC Trusted Publishing)
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      accept_evidence_review:
        description: 'I checked the exact tag source-bound support, visual and manual acceptance evidence; this creates no approvals'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      published: ${{ steps.registry.outputs.published }}
      source_sha: ${{ steps.validation.outputs.source_sha }}
      receipt_sha256: ${{ steps.validation.outputs.receipt_sha256 }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      CS_PUBLICATION_MANUAL_ACCEPTANCE: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.accept_evidence_review)) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: ./.github/actions/setup-npm
      - name: Check exact registry version, failing closed on service errors
        id: registry
        run: node scripts/validate-publication.mjs --registry
      - name: Install locked dependencies
        if: steps.registry.outputs.published == 'false'
        run: npm ci
      - name: Install Playwright Chromium for token mode and fast-gate validation
        if: steps.registry.outputs.published == 'false'
        run: npx --no-install playwright install --with-deps chromium
      - name: Set up isolated Python font and PDF test dependencies
        if: steps.registry.outputs.published == 'false'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - name: Install hash-pinned Python test tools
        if: steps.registry.outputs.published == 'false'
        run: |
          python -m venv "$RUNNER_TEMP/publication-python"
          "$RUNNER_TEMP/publication-python/bin/python" -m pip install --require-hashes --only-binary=:all: --no-deps -r scripts/requirements-fonts.txt -r _audit/ci/requirements-pdf.txt
          echo "$RUNNER_TEMP/publication-python/bin" >> "$GITHUB_PATH"
          echo "CS_PDF_PYTHON=$RUNNER_TEMP/publication-python/bin/python" >> "$GITHUB_ENV"
      - name: Validate exact tag, approvals, notices and all required gates, then pack exact bytes
        if: steps.registry.outputs.published == 'false'
        id: validation
        run: node scripts/validate-publication.mjs --run --directory "$RUNNER_TEMP/publication-candidate"
      - name: Retain immutable candidate, receipt and diagnostics
        if: always() && steps.registry.outputs.published == 'false'
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: publication-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-candidate/
          if-no-files-found: warn
      - name: Retain full diagnostic gate evidence
        if: always() && steps.registry.outputs.published == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: publication-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            _audit/ci/pixel-diff-report.json
            _audit/ci/import-report.json
          if-no-files-found: warn
  publish:
    needs: validate
    if: ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.accept_evidence_review)) && needs.validate.result == 'success' && needs.validate.outputs.published == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      CS_PUBLICATION_MANUAL_ACCEPTANCE: 'true'
      PUBLICATION_RECEIPT_SHA256: ${{ needs.validate.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: ./.github/actions/setup-npm
      - name: Download only this validation job's immutable artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8; official tag verified
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/validated-publication
          digest-mismatch: error
      - name: Revalidate receipt, exact source, support, notices and tarball bytes
        id: identity
        run: node scripts/validate-publication.mjs --check --receipt "$RUNNER_TEMP/validated-publication/receipt.json" --expected-sha256 "$PUBLICATION_RECEIPT_SHA256"
      - name: Recheck registry immediately before publication
        id: registry
        run: node scripts/validate-publication.mjs --registry
      - name: Publish the exact validated tarball via OIDC
        if: steps.registry.outputs.published == 'false'
        env:
          PUBLICATION_PACKAGE_FILENAME: ${{ steps.identity.outputs.package_filename }}
        # All prepublish/source/unit/browser gates ran in the read-only job on these exact bytes.
        # Tarball hooks cannot execute new source or rebuild a different artifact in the OIDC job.
        run: npm publish "$RUNNER_TEMP/validated-publication/$PUBLICATION_PACKAGE_FILENAME" --ignore-scripts --provenance --access public
      - name: Create or update GitHub Release for the published tag
        if: steps.registry.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_PACKAGE_FILENAME: ${{ steps.identity.outputs.package_filename }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          import { join } from 'node:path';

          const dir = join(process.env.RUNNER_TEMP, 'validated-publication');
          const receipt = JSON.parse(readFileSync(join(dir, 'receipt.json'), 'utf8'));
          const pkgBytes = readFileSync(join(dir, process.env.PUBLICATION_PACKAGE_FILENAME));
          const shasum = createHash('sha1').update(pkgBytes).digest('hex');
          const version = receipt.source.version;
          const tag = `v${version}`;
          const repo = receipt.context.repository;
          const runId = receipt.context.runId;
          const runUrl = `https://github.com/${repo}/actions/runs/${runId}`;

          let sigstoreLine = '';
          try {
            const res = await fetch(`https://registry.npmjs.org/-/npm/v1/attestations/@cyberskill%2fdesign@${version}`);
            if (res.ok) {
              const data = await res.json();
              const logIndex = data.attestations?.map(a => a.bundle?.verificationMaterial?.tlogEntries?.[0]?.logIndex).filter(Boolean).at(-1);
              if (logIndex) {
                sigstoreLine = `- **Sigstore Transparency Log:** [\`logIndex=${logIndex}\`](https://search.sigstore.dev/?logIndex=${logIndex})`;
              }
            }
          } catch {}

          const notes = [
            `## @cyberskill/design@${version}`,
            '',
            '### Định danh phát hành (Release Identity)',
            '',
            `- **Phiên bản (Version):** \`${version}\` (\`@cyberskill/design@${version}\`)`,
            `- **Tag:** \`${tag}\``,
            `- **Source Commit (\`gitHead\`):** \`${receipt.context.sourceSha}\``,
            `- **Source Tree:** \`${receipt.source.tree}\``,
            `- **Tarball SHA-256:** \`${receipt.package.sha256}\``,
            `- **Tarball SHA-1 (\`shasum\`):** \`${shasum}\``,
            `- **Integrity:** \`${receipt.package.integrity}\``,
            `- **OIDC Trusted Publishing Run:** [\`${runId}\`](${runUrl})`,
            ...(sigstoreLine ? [sigstoreLine] : []),
            '',
            '---',
            '',
            '### Phạm vi phát hành & Xác minh (Release Scope & Verification)',
            '',
            `- **125 public exports** (120 components, 4 constants, 1 hook) đã được review và ký xác nhận trong \`components/lifecycle.json\` (\`supportSha256: ${receipt.source.supportSha256}\`).`,
            '- **85 mẫu tài liệu & ấn phẩm (templates)** (bao gồm 38 biểu mẫu pháp lý/nhân sự/quản trị doanh nghiệp tiếng Việt) cùng kiểm tra xuất bản trình duyệt, DOCX và PDF.',
            '- **397 khai báo token công khai** và **256 chế độ token độc lập** (\`Theme × Element × Density × Contrast\`) đồng bộ trên CSS, DTCG JSON, Swift (\`CSTokens.swift\` / \`CSModes.swift\`), Kotlin (\`CSTokens.kt\` / \`CSModes.kt\`) và Dart (\`cs_tokens.dart\` / \`cs_modes.dart\`).',
            '- **Xác minh cổng chất lượng (Verification Gates):**',
            '  - Đầy đủ kiểm tra tính toàn vẹn phát hành (\`security:audit\`, \`security:audit-python\`, \`build\`, \`build:check\`, \`verify:browser\`, \`test:pack-hygiene\`).',
            '  - 16/16 chuẩn hình ảnh Linux Chromium (\`_audit/baselines/*.png\`) và 42/42 cổng kiểm toán trên bảng \`_audit/run.html\`.',
            '',
            '```bash',
            `npm install @cyberskill/design@${version}`,
            '```',
            ''
          ].join('\n');

          const notesPath = join(process.env.RUNNER_TEMP, 'release-notes.md');
          writeFileSync(notesPath, notes, 'utf8');

          const exists = spawnSync('gh', ['release', 'view', tag, '--repo', repo], { stdio: 'ignore' }).status === 0;
          const args = exists
            ? ['release', 'edit', tag, '--repo', repo, '--title', `${tag} — @cyberskill/design@${version}`, '--notes-file', notesPath, '--latest']
            : ['release', 'create', tag, '--repo', repo, '--verify-tag', '--title', `${tag} — @cyberskill/design@${version}`, '--notes-file', notesPath, '--latest'];
          const out = spawnSync('gh', args, { stdio: 'inherit' });
          if (out.status !== 0) process.exit(out.status ?? 1);
          JS
