# Compilation/widget evidence only; no signing, publication or deployment.
name: native-validation
on:
  workflow_dispatch:
  pull_request:
    paths: ['tokens/**', 'examples/native/**', 'scripts/ci/native-validation.sh', 'scripts/generate-native-sample-*.mjs', '.github/workflows/native-validation.yml', 'scripts/generate-native-mode-packs.mjs', 'scripts/lib/native-mode-*.mjs', '_audit/ci/test-native-mode-*.mjs', '_audit/ci/lib/native-mode-*.mjs']
  push:
    branches: ['main', 'codex/native-validation-*']
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: swiftui
            runner: macos-15
          - platform: compose
            runner: ubuntu-24.04
          - platform: flutter
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize native evidence
        shell: bash
        run: |
          mkdir -p native-evidence
          git rev-parse HEAD > native-evidence/source-commit.txt
          git ls-files -z package.json package-lock.json scripts/bootstrap-toolchain.mjs scripts/check-npm-version.mjs .github/actions/setup-npm/action.yml .github/workflows/native-validation.yml |
            xargs -0 shasum -a 256 > native-evidence/toolchain-source.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/setup-npm
      - name: Install locked native validation tools
        shell: bash
        run: |
          mkdir -p native-evidence
          set -o pipefail
          node scripts/npm.mjs ci 2>&1 | tee native-evidence/npm-ci.log
      - name: Validate native sample
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          mkdir -p native-evidence
          set -o pipefail
          bash scripts/ci/native-validation.sh 2>&1 | tee native-evidence/build.log
      - name: Retain source and environment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: native-evidence/
          if-no-files-found: error
