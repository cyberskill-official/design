name: Version PR

# Changesets keeps a "chore: version packages" PR open on main. Merging it bumps the version and CHANGELOG.
# Publishing is separate: push the tag (v3.0.0, or v3.0.0-next.1 in pre mode) and npm-publish.yml publishes it.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency: version-pr-${{ github.ref }}

jobs:
  version-pr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51  # v2.1.2
        with:
          version-script: npm run version-packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
