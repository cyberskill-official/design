# Dependabot — modest weekly bumps for root tooling + the registry consumer example.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Provenance-locked dependencies (require synchronized Linux container,
      # editor-parser attribution, or vendor UMD bundle updates):
      - dependency-name: "playwright"
      - dependency-name: "parse5"
      - dependency-name: "react"
      - dependency-name: "react-dom"
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /examples/npm-hello
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-hello:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
