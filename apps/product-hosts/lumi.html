<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lumi · Stable host</title>
<link rel="stylesheet" href="../../packages/tokens/dist/tokens.css"/>
<link rel="stylesheet" href="../../styles.css"/>
</head>
<body>
<main id="main" data-stable-host="lumi">
<div class="cs-root cs-theme-provider" data-theme="light" data-cs-contrast="standard" data-cs-density="comfortable" dir="ltr"><div data-product="lumi" data-cs-element="hoa" data-cs-variant="plasma"><div><span class="cs-lumi cs-lumi--md"><span aria-hidden="true">✦</span></span><div class="cs-chat-msg cs-chat-msg--lumi"><div class="cs-chat-msg__avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z"></path></svg></div><div class="cs-chat-msg__col"><div class="cs-chat-msg__name">Lumi</div><div class="cs-chat-msg__bubble">A wish worth granting.</div></div></div><div class="cs-prompt"><textarea class="cs-prompt__field" rows="1" placeholder="Nhập điều ước của bạn…"></textarea><div class="cs-prompt__bar"><span class="cs-prompt__hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z"></path></svg>Lumi trả lời, rồi chuyển điều ước rõ ràng cho con người.</span><button type="button" class="cs-button cs-button--primary cs-button--sm">Gửi</button></div></div></div></div></div>
</main>
</body>
</html>
