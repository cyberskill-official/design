<!-- @dsCard group="Components" viewport="700x320" name="Dialog" subtitle="Modal overlay + panel with footer actions" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--cs-color-surface-page); padding: 22px 24px; }
  /* Scope the fixed dialog layer to the preview frame so it renders inline in the card. */
  .frame { position: relative; height: 256px; border: 1px solid var(--cs-color-border-default); border-radius: var(--cs-radius-lg); overflow: hidden; background: var(--cs-color-surface-raised); }
  .frame .cs-dialog-layer { position: absolute; }
  .frame .cs-dialog { top: 24px; }
</style>
<script src="../../_vendor/react/react.production.min.js"></script>
<script src="../../_vendor/react/react-dom.production.min.js"></script>
<script src="../../_vendor/babel/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Dialog, Button } = (window[Object.keys(window).find(k=>/^CyberSkillDesignSystem_[0-9a-f]{6}$/.test(k))]||{});
function Demo() {
  const [open, setOpen] = React.useState(true);
  return (
    <div className="frame">
      {!open && <div style={{padding:24}}><Button onClick={() => setOpen(true)}>Open dialog</Button></div>}
      <Dialog
        open={open}
        title="Send your wish?"
        onClose={() => setOpen(false)}
        actions={<>
          <Button variant="secondary" onClick={() => setOpen(false)}>Not now</Button>
          <Button onClick={() => setOpen(false)}>Send wish</Button>
        </>}
      >
        A real person on the team replies within one business day. We never share your details.
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
