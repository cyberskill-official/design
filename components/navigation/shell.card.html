<!-- @dsCard group="Components" viewport="700x420" name="App shell — Sidebar, Steps, Command" subtitle="Sidebar + NavItem, Steps, CommandPalette" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--cs-color-surface-page); padding: 22px 24px; }
  .lbl { font: 600 11px/1 var(--cs-font-family-ui); text-transform: uppercase; letter-spacing: .09em; color: var(--cs-color-text-muted); margin-bottom: 10px; }
  .split { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: start; }
  .sb { border: 1px solid var(--cs-color-border-default); border-radius: var(--cs-radius-lg); overflow: hidden; }
  .frame { position: relative; overflow: hidden; height: 210px; border: 1px solid var(--cs-color-border-default); border-radius: var(--cs-radius-lg); margin-top: 18px; background: var(--cs-color-surface-raised); }
  .frame .cs-cmdk-scrim { position: absolute; padding-top: 14px; }
  .frame .cs-cmdk { inline-size: 100%; box-shadow: none; }
</style>
<script src="https://unpkg.com/umd-react@19.2.8/dist/react.development.js" integrity="sha384-r22tQd8qRIHDPIkmdXZcVtvPi1Tj2x1QaW2tmFQHEvHscATUnHQ5siTyxWw5PMUs" crossorigin="anonymous"></script>
<script src="https://unpkg.com/umd-react@19.2.8/dist/react-dom.development.js" integrity="sha384-gJZYmumEmwqVmX3JVsLZq+4QrxoPGh/BW47Rk7SqNPCPFpTGnRtvmeRPJ7//ZDPk" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Sidebar, NavItem, Steps, CommandPalette, Badge } = (window[Object.keys(window).find(k=>/^CyberSkillDesignSystem_[0-9a-f]{6}$/.test(k))]||{});
function Demo() {
  return (
    <div>
      <div className="split">
        <div className="sb" style={{width:230}}>
          <Sidebar label="Workspace">
            <NavItem active>Overview</NavItem>
            <NavItem trail={<Badge>3</Badge>}>Projects</NavItem>
            <NavItem>Releases</NavItem>
            <NavItem>Settings</NavItem>
          </Sidebar>
        </div>
        <div>
          <div className="lbl">Steps · the arc of a wish</div>
          <Steps current={1} steps={[{title:"Make a wish"},{title:"Shape it"},{title:"Build to ship"},{title:"Built to last"}]} />
          <div className="lbl" style={{marginTop:20}}>Command palette (⌘K)</div>
          <div className="frame">
            <CommandPalette open={true} onClose={()=>{}} groups={[{label:"Go to",items:[{label:"Dashboard",shortcut:"G D"},{label:"Releases",shortcut:"G R"}]},{label:"Actions",items:[{label:"New project",shortcut:"N"},{label:"Talk to Lumi",shortcut:"L"}]}]} />
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
