<!-- @dsCard group="Components" viewport="700x360" name="Scoped UI messages" subtitle="LocaleProvider is context-only; useMessages reads scoped copy" -->
<!doctype html><html lang="en"><head><title>Scoped UI messages — CyberSkill</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:24px;background:var(--cs-color-surface-page);color:var(--cs-color-text-primary);font-family:var(--cs-font-family-ui)}label,output{display:block;margin-block:12px}input,select{font:inherit}</style><script src="../../_vendor/react/react.production.min.js"></script><script src="../../_vendor/react/react-dom.production.min.js"></script><script src="../../_vendor/babel/babel.min.js"></script><script src="../../_ds_bundle.js"></script></head><body><div id="root"></div><script type="text/babel">
const {LocaleProvider,useMessages}=window[Object.keys(window).find(k=>/^CyberSkillDesignSystem_[0-9a-f]{6}$/.test(k))];
function Copy({lang}){const t=useMessages('SpecimenCopy',lang);return <output data-copy>{t('continue')}</output>;}
function Demo(){const[lang,setLang]=React.useState('en'),[copy,setCopy]=React.useState('Continue');const V=lang==='vi';return <main lang={lang}><h1>{V?'Thông điệp theo scope':'Scoped UI messages'}</h1><p>{V?'Provider chỉ cung cấp context, không tạo phần tử DOM.':'The provider supplies context and creates no DOM element.'}</p><label>{V?'Ngôn ngữ':'Language'}<select className="cs-touch-target" value={lang} onChange={e=>setLang(e.target.value)}><option value="en">English</option><option value="vi">Tiếng Việt</option></select></label><label>{V?'Nội dung tiếng Anh theo scope':'Scoped English copy'}<input className="cs-touch-target" value={copy} onChange={e=>setCopy(e.target.value)}/></label><LocaleProvider messages={{SpecimenCopy:{en:{continue:copy},vi:{continue:'Tiếp tục'}}}}><Copy lang={lang}/></LocaleProvider><p>{V?'Bên ngoài scope dùng khóa dự phòng:':'Outside the scope, the missing key falls back:'}</p><Copy lang={lang}/></main>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
