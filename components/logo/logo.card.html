<!-- @dsCard group="Components" viewport="700x220" name="Logo" subtitle="Official mark — Umber ground, Ochre genie. Never recolour." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--cs-color-surface-page); padding: 22px 24px; }
  .row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .swatch { display: grid; place-items: center; width: 96px; height: 96px; border-radius: var(--cs-radius-lg); }
  .on-umber { background: var(--cs-color-brand-umber); }
  .on-page { background: var(--cs-color-surface-panel); border: 1px solid var(--cs-color-border-default); }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .lockup b { font: 800 22px/1 var(--cs-font-family-ui); color: var(--cs-color-brand-umber); letter-spacing: -.01em; }
  .cap { font: 500 12px/1.4 var(--cs-font-family-ui); color: var(--cs-color-text-muted); }
</style>
<script src="https://unpkg.com/umd-react@19.2.8/dist/react.development.js" integrity="sha384-r22tQd8qRIHDPIkmdXZcVtvPi1Tj2x1QaW2tmFQHEvHscATUnHQ5siTyxWw5PMUs" crossorigin="anonymous"></script>
<script src="https://unpkg.com/umd-react@19.2.8/dist/react-dom.development.js" integrity="sha384-gJZYmumEmwqVmX3JVsLZq+4QrxoPGh/BW47Rk7SqNPCPFpTGnRtvmeRPJ7//ZDPk" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Logo } = (window[Object.keys(window).find(k=>/^CyberSkillDesignSystem_[0-9a-f]{6}$/.test(k))]||{});
function Demo() {
  return (
    <div className="row">
      <div className="swatch on-page"><Logo size={64} /></div>
      <div className="lockup"><Logo size={44} /><b>CyberSkill</b></div>
      <div>
        <div className="lockup" style={{gap:16}}>
          <Logo size={40} /><Logo size={28} /><Logo size={20} />
        </div>
        <p className="cap" style={{marginTop:10}}>Clear space ≥ 25% of mark height. Do not recolour, rotate, or stretch.</p>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
