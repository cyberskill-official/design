<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CyberSkill — docs link check</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--cs-font-family-ui,system-ui);background:#efe6d8;color:#231a12;padding:16px 20px}
  h1{font-size:16px;margin:0 0 2px}
  .lede{color:#6b5d4f;max-width:920px;line-height:1.5;margin:0 0 14px;font-size:13px}
  .row{padding:6px 10px;border-radius:6px;font:12.5px ui-monospace,monospace;max-width:960px;margin-bottom:2px}
  .row.ok{background:#dcfce7;color:#166534}.row.bad{background:#FEE2E2;color:#B42318;font-weight:700}
  #sum{font-size:15px;font-weight:800;margin:12px 0}
</style></head><body>
<h1>Docs link check</h1>
<p class="lede">Crawls required published markdown and curated MDX for broken in-repo relative links and retired paths (<code>status.html</code>, status-legacy, Identity Lab). External <code>https://</code> URLs are skipped (no network). Verdict on <code>window.__docslinkcheck</code>.</p>
<div id="list"></div>
<div id="sum">running…</div>
<script>
const P=window.__gateProgress={done:0,total:1,current:'boot'};
const list=document.getElementById('list');
function row(ok,t){ const d=document.createElement('div'); d.className='row '+(ok?'ok':'bad'); d.innerHTML=(ok?'\u2713 ':'\u2717 ')+t; list.appendChild(d); }
function publish(v){ if(window.__docslinkcheck) return; window.__docslinkcheck=v; const s=document.getElementById('sum'); s.textContent=v.pass?('\u2713 '+v.scanned+' files'):('\u2717 '+(v.error||v.problems.length+' broken')); s.style.color=v.pass?'#166534':'#B42318'; console.log('DOCSLINKCHECK VERDICT '+JSON.stringify({pass:v.pass,scanned:v.scanned,problems:(v.problems||[]).slice(0,10),error:v.error||null})); }
async function fetchRaw(path){
  const r=await fetch('../'+path,{cache:'no-store'});
  const t=await r.text();
  if(!r.ok) return {ok:false,text:'',err:'HTTP '+r.status};
  if(/^\s*<(!doctype|html)/i.test(t) && !/\.html$/i.test(path)) return {ok:false,text:'',err:'got HTML'};
  return {ok:true,text:t,err:null};
}
const RETIRED=[/status\.html(?![-\w])/i,/status-legacy\.html/i,/guidelines\/identity-lab/i,/identity-lab\.html/i];
function dirname(p){ const i=p.lastIndexOf('/'); return i<0?'':p.slice(0,i); }
function joinRel(fromDir, href){
  const parts=(fromDir?fromDir.split('/'):[]).concat(href.split('/'));
  const out=[];
  for(const part of parts){
    if(!part || part==='.') continue;
    if(part==='..') out.pop();
    else out.push(part);
  }
  return out.join('/');
}
(async()=>{
  const problems=[];
  const catR=await fetchRaw('_audit/docs-catalog.json');
  if(!catR.ok) throw new Error('catalog '+catR.err);
  const catalog=JSON.parse(catR.text);
  const required=[
    ...(catalog.entrance||[]).map(p=>p.path),
    ...(catalog.pages||[]).map(p=>p.path),
    ...(catalog.pages||[]).filter(p=>p.mdx).map(p=>p.mdx),
    ...(catalog.curated||[]).filter(p=>p.mdx).map(p=>p.mdx),
  ];
  P.total=required.length;
  let scanned=0;
  for(const rel of required){
    P.current=rel; P.done=scanned;
    const file=await fetchRaw(rel);
    if(!file.ok){ problems.push(rel+': '+file.err); continue; }
    scanned++;
    const text=file.text;
    for(const re of RETIRED){
      re.lastIndex=0;
      if(re.test(text) && /\]\([^)]*\)|href=|src=/.test(text)){
        const hrefHit=new RegExp('(?:\\]\\(|href=["\']|src=["\'])[^)"\']*'+re.source,'i');
        if(hrefHit.test(text)) problems.push(rel+': retired live href');
      }
    }
    const re=/\[([^\]]*)\]\(([^)\s]+)\)/g; let m;
    while((m=re.exec(text))){
      const href=m[2];
      const clean=href.split('#')[0].split('?')[0];
      if(!clean) continue;
      if(/[<>{}]/.test(clean)) continue;
      if(/^(https?:|mailto:|data:)/i.test(clean)) continue;
      const target=clean.startsWith('/') ? clean.replace(/^\/+/,'') : joinRel(dirname(rel), clean);
      const got=await fetchRaw(target);
      if(!got.ok) problems.push(rel+': broken '+href+' → '+target);
    }
  }
  P.done=scanned;
  row(problems.length===0, scanned+' files · '+problems.length+' problems');
  problems.slice(0,40).forEach(p=>row(false,p));
  publish({pass:problems.length===0,scanned,problems});
})().catch(e=>publish({pass:false,scanned:0,problems:[],error:String(e&&e.message||e).slice(0,160)}));
setTimeout(()=>{ if(!window.__docslinkcheck) publish({pass:false,scanned:P.done,problems:[],error:'watchdog'}); },60000);
</script></body></html>
