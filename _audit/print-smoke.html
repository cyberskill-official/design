<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CyberSkill — print smoke</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--cs-font-family-ui);background:#efe6d8;color:#231a12;padding:16px 20px}
  h1{font-size:16px;margin:0 0 6px}.lede{font-size:13px;color:#6b5d4f;max-width:900px;line-height:1.5}
  .row{font:12.5px ui-monospace,monospace;padding:4px 8px;border-radius:5px;margin:2px 0}
  .ok{background:#dcfce7;color:#166534}.bad{background:#FEE2E2;color:#B42318;font-weight:700}
  #sum{font-size:15px;font-weight:800;margin:12px 0}
</style></head><body>
<h1>Print smoke</h1>
<p class="lede">Fetches <b>every</b> document-style template that declares print ownership (<code>omelette-owns-print</code>) and asserts the meta plus A4/Letter <code>@page</code> hooks the export path relies on. Verdict: <code>window.__printsmoke.pass</code>.</p>
<div id="list"></div><div id="sum">running…</div>
<script>
const list=document.getElementById('list');
const P=window.__gateProgress={done:0,total:2,current:'boot'};
function row(ok,t){const d=document.createElement('div');d.className='row '+(ok?'ok':'bad');d.textContent=(ok?'✓ ':'✗ ')+t;list.appendChild(d);}
(async()=>{
  P.current='manifest'; const M=await (await fetch('../_ds_manifest.json',{cache:'no-store'})).json();
  // Whole set: every template whose entry HTML declares omelette-owns-print (not a curated sample).
  const candidates=M.templates||[];
  P.total=candidates.length+1;
  const docs=[];
  for(const t of candidates){
    P.current=t.entryPath||t.folder;
    try{
      const html=await (await fetch('../'+t.entryPath,{cache:'no-store'})).text();
      if(/omelette-owns-print|name=["']omelette-owns-print/i.test(html)) docs.push({t,html});
    }catch(e){ /* fetch errors counted below if listed as print */ }
    P.done++;
  }
  P.current='assert';
  const fails=[]; let okc=0;
  for(const {t,html} of docs){
    const owns=/omelette-owns-print|name=["']omelette-owns-print/i.test(html);
    const page=/@page\s*\{[^}]*size:\s*(A4|letter)/i.test(html);
    if(owns && page){ okc++; row(true, (t.name||t.entryPath)+' · '+(html.match(/size:\s*(A4|letter)/i)||[])[1]); }
    else { fails.push(t.entryPath); row(false, (t.name||t.entryPath)+' missing print meta/@page size'); }
  }
  P.done=P.total; P.current='done';
  const pass=fails.length===0 && docs.length>=60;
  window.__printsmoke={pass,ok:okc,total:docs.length,fails};
  const s=document.getElementById('sum');
  s.textContent=pass?('✓ PASS — '+okc+'/'+docs.length+' print-ready docs (whole set)'):('✗ FAIL — '+fails.length+' · scanned '+docs.length);
  s.style.color=pass?'#166534':'#B42318';
})().catch(e=>{ window.__printsmoke={pass:false,error:String(e)}; document.getElementById('sum').textContent='✗ '+e; });
</script></body></html>
