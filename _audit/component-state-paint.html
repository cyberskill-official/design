<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CyberSkill — component state paint</title>
<link rel="stylesheet" href="../styles.css">
<script src="../_vendor/react/react.production.min.js" integrity="sha384-/nh8CKeV7Pk42Gpda6L4DM1JtZ2bwPOi+eh9O7+a1Y22UkGs8+mw3aW1shQ9FV30"></script>
<script src="../_vendor/react/react-dom.production.min.js" integrity="sha384-rhLCB72qrpcezgY2QW0panvW9IeO32m94nvuDVRD/iEGHXoUbjtijL6Xi/Z5/mzu"></script>
<script src="../_ds_bundle.js"></script>
<style>
  body{margin:0;font-family:var(--cs-font-family-ui,system-ui);background:#efe6d8;color:#231a12;padding:16px 20px}
  h1{font-size:16px;margin:0 0 2px}
  .lede{color:#6b5d4f;max-width:900px;line-height:1.5;margin:0 0 14px;font-size:13px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:6px;font:12.5px ui-monospace,monospace;max-width:820px;margin-bottom:2px}
  .row.ok{background:#dcfce7;color:#166534}.row.bad{background:#FEE2E2;color:#B42318;font-weight:700}
  #sum{font-size:15px;font-weight:800;margin:12px 0}
  #stage{position:relative;width:720px;min-height:80px}
  *,*::before,*::after{transition:none!important;animation:none!important}
</style></head><body>
<h1>Component state paint</h1>
<p class="lede">Hard paint contract for button variants, an open dialog, an open menu, a field error and a selected data row in light and dark. Channel delta uses <code>PIXEL_CHANNEL_TOLERANCE</code>. The 15 Linux page PNGs stay the pixel-diff set. Verdict on <code>window.__statepaint</code>.</p>
<div id="list"></div>
<div id="sum">running…</div>
<div id="stage"></div>
<script type="module">
import { PIXEL_CHANNEL_TOLERANCE } from './lib/pixel-report-contract.mjs';

const EXPECTED = {
  light: {
    'primary button': { bg: [69, 33, 14], fg: [255, 255, 255] },
    'secondary button': { bg: [255, 255, 255], fg: [69, 33, 14] },
    'ghost button': { bg: 'transparent', fg: [69, 33, 14] },
    'danger button': { bg: [180, 35, 24], fg: [255, 255, 255] },
    'field error': { fg: [75, 5, 2] },
    'selected row': { bg: [251, 244, 233], fg: [69, 33, 14] },
    'dialog': { bg: [255, 255, 255], fg: [69, 33, 14] },
    'menu': { bg: [255, 255, 255] },
    'menu item': { fg: [69, 33, 14] },
  },
  dark: {
    'primary button': { bg: [244, 186, 23], fg: [26, 17, 8] },
    'secondary button': { bg: [34, 23, 16], fg: [244, 186, 23] },
    'ghost button': { bg: 'transparent', fg: [245, 234, 217] },
    'danger button': { bg: [252, 152, 149], fg: [26, 17, 8] },
    'field error': { fg: [255, 210, 207] },
    'selected row': { bg: [66, 48, 24], fg: [245, 234, 217] },
    'dialog': { bg: [34, 23, 16], fg: [245, 234, 217] },
    'menu': { bg: [34, 23, 16] },
    'menu item': { fg: [245, 234, 217] },
  },
};

function oklabToRgb(L, a, b) {
  const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
  const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
  const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
  const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
  let r = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
  let g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
  let bl = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
  const gamma = c => {
    const clamped = Math.min(1, Math.max(0, c));
    return Math.round((clamped <= 0.0031308 ? 12.92 * clamped : 1.055 * clamped ** (1 / 2.4) - 0.055) * 255);
  };
  return [gamma(r), gamma(g), gamma(bl)];
}

function parseColor(css) {
  const rgb = css.match(/rgba?\(([^)]+)\)/);
  if (rgb) {
    const parts = rgb[1].split(',').map(part => Number(part.trim()));
    if (parts.length === 4 && parts[3] === 0) return 'transparent';
    return parts.slice(0, 3).map(part => Math.round(part));
  }
  const lab = css.match(/oklab\(([^)]+)\)/);
  if (lab) {
    const [L, a, b] = lab[1].trim().split(/\s+/).map(Number);
    return oklabToRgb(L, a, b);
  }
  throw new Error('unparsed color ' + css);
}

function near(actual, expected, label) {
  if (expected === 'transparent') {
    if (actual !== 'transparent') throw new Error(label + ' expected transparent, got ' + actual);
    return;
  }
  if (!Array.isArray(actual)) throw new Error(label + ' ' + actual);
  for (let i = 0; i < 3; i++) {
    if (Math.abs(actual[i] - expected[i]) > PIXEL_CHANNEL_TOLERANCE) {
      throw new Error(label + ' ' + actual + ' vs ' + expected + ' tolerance ' + PIXEL_CHANNEL_TOLERANCE);
    }
  }
}

const list = document.getElementById('list');
const stage = document.getElementById('stage');
const results = [];
function record(name, ok, detail) {
  results.push({ name, ok, detail });
  const row = document.createElement('div');
  row.className = 'row ' + (ok ? 'ok' : 'bad');
  row.textContent = (ok ? '✓ ' : '✗ ') + name + (detail ? ' — ' + detail : '');
  list.appendChild(row);
}

function paintOf(element) {
  const style = getComputedStyle(element);
  return { bg: parseColor(style.backgroundColor), fg: parseColor(style.color) };
}

function check(theme, name, element) {
  const expected = EXPECTED[theme][name];
  const paint = paintOf(element);
  if (expected.bg) near(paint.bg, expected.bg, theme + ' ' + name + ' fill');
  if (expected.fg) near(paint.fg, expected.fg, theme + ' ' + name + ' text');
  record(theme + ' ' + name, true, '');
}

const NS = window[Object.keys(window).find(k => /^CyberSkillDesignSystem_[0-9a-f]{6}$/.test(k))];
const h = React.createElement;
let root;
function render(theme, node) {
  document.documentElement.setAttribute('data-theme', theme);
  if (!root) root = ReactDOM.createRoot(stage);
  ReactDOM.flushSync(() => root.render(node));
}

try {
  if (!NS || !ReactDOM.flushSync) throw new Error('bundle or flushSync missing');
  const button = variant => h(NS.Button, { variant }, variant);
  const field = h(NS.TextField, { label: 'Email', error: 'Required' });
  const grid = h(NS.DataGrid, { selectable: true, selected: ['1'], columns: [{ key: 'n', header: 'Name' }], rows: [{ id: '1', n: 'An' }] });
  const dialog = h(NS.Dialog, { open: true, title: 'Notice', onOpenChange() {} }, 'Body');
  const menu = h(NS.Menu, { open: true, onOpenChange() {}, trigger: h('button', { type: 'button' }, 'File') }, h(NS.MenuItem, null, 'Open'));
  for (const theme of ['light', 'dark']) {
    render(theme, h('div', null, button('primary'), button('secondary'), button('ghost'), button('danger')));
    check(theme, 'primary button', stage.querySelector('.cs-button--primary'));
    check(theme, 'secondary button', stage.querySelector('.cs-button--secondary'));
    check(theme, 'ghost button', stage.querySelector('.cs-button--ghost'));
    check(theme, 'danger button', stage.querySelector('.cs-button--danger'));
    render(theme, field);
    check(theme, 'field error', stage.querySelector('.cs-field__error'));
    render(theme, grid);
    check(theme, 'selected row', stage.querySelector('.cs-datagrid tr.is-selected td'));
    render(theme, dialog);
    check(theme, 'dialog', document.querySelector('.cs-dialog'));
    render(theme, menu);
    const item = document.querySelector('.cs-menu__item');
    check(theme, 'menu', item.closest('.cs-menu__list'));
    check(theme, 'menu item', item);
  }
  render('light', button('primary'));
  const restored = paintOf(stage.querySelector('.cs-button--primary'));
  near(restored.bg, EXPECTED.light['primary button'].bg, 'light after dark fill');
  near(restored.fg, EXPECTED.light['primary button'].fg, 'light after dark text');
  record('light primary after dark', true, '');
  const failed = results.filter(row => !row.ok);
  window.__statepaint = { pass: failed.length === 0, total: results.length, failed: failed.map(row => row.name), results };
} catch (error) {
  record('paint contract', false, String(error.message || error));
  const failed = results.filter(row => !row.ok);
  window.__statepaint = { pass: false, total: results.length, failed: failed.map(row => row.name), error: String(error.message || error), results };
}
const verdict = window.__statepaint;
const sum = document.getElementById('sum');
sum.textContent = verdict.pass ? '✓ all ' + verdict.total + ' paint checks pass' : '✗ ' + (verdict.error || verdict.failed.join(', '));
sum.style.color = verdict.pass ? '#166534' : '#B42318';
window.__gateProgress = { done: verdict.total, total: verdict.total, current: 'done' };
</script>
</body></html>
