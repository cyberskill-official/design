<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>High-risk AT</title>
<link rel="stylesheet" href="../styles.css">
<script src="../_vendor/react/react.production.min.js"></script>
<script src="../_vendor/react/react-dom.production.min.js"></script>
<script src="../_ds_bundle.js"></script>
</head><body>
<main id="main"><p id="sum">running…</p></main>
<div id="stage"></div>
<script>
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const h = React.createElement;
const NS = window[Object.keys(window).find((k) => /^CyberSkillDesignSystem_[0-9a-f]{6}$/.test(k))];
const stage = document.getElementById("stage");
const results = [];
function mount(el) {
  const c = document.createElement("div");
  stage.appendChild(c);
  ReactDOM.createRoot(c).render(el);
  return c;
}
function assert(c, m) { if (!c) throw new Error(m); }
function kd(t, key) { t.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true })); }
const PIXEL = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==";
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 2000)) {
    try { if (fn()) return true; } catch { /* retry */ }
    await wait(40);
  }
  return !!fn();
}
async function test(name, fn) {
  try { await fn(); results.push({ name, ok: true }); }
  catch (e) { results.push({ name, ok: false, detail: String(e.message || e).slice(0, 160) }); }
}
async function run() {
  const {
    Dialog, AlertDialog, Menu, MenuItem, Button, Combobox, DataGrid, Sortable,
    Editor, Carousel, DatePicker, TimePicker, Image, PromptInput,
  } = NS || {};
  const times = [];

  await test("Dialog keyboard", async () => {
    assert(Dialog, "Dialog");
    function App() {
      const [o, setO] = React.useState(false);
      return h("div", null,
        h("button", { className: "d-trig", onClick: () => setO(true) }, "Open"),
        o ? h(Dialog, { open: true, title: "T", onClose: () => setO(false) }, "body") : null,
      );
    }
    const c = mount(h(App));
    await wait(40);
    for (let i = 0; i < 8; i++) {
      const t0 = performance.now();
      c.querySelector(".d-trig").click();
      assert(await until(() => document.querySelector('[role="dialog"]')), "dialog");
      times.push(performance.now() - t0);
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
      assert(await until(() => !document.querySelector('[role="dialog"]')), "esc");
    }
  });

  await test("AlertDialog keyboard", async () => {
    assert(AlertDialog, "AlertDialog");
    function App() {
      const [o, setO] = React.useState(false);
      return h("div", null,
        h("button", { className: "a-trig", onClick: () => setO(true) }, "Open"),
        o ? h(AlertDialog, { open: true, title: "Del", description: "Sure", onOpenChange: setO, onConfirm: () => {} }) : null,
      );
    }
    const c = mount(h(App));
    await wait(40);
    const trig = c.querySelector(".a-trig");
    assert(trig, "trigger");
    trig.click();
    assert(await until(() => document.querySelector('[role="alertdialog"], [role="dialog"]')), "alert");
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    assert(await until(() => !document.querySelector('[role="alertdialog"]')), "esc");
  });

  await test("Menu keyboard", async () => {
    assert(Menu && MenuItem && Button, "Menu");
    const c = mount(h(Menu, { trigger: h(Button, { size: "sm" }, "Open") }, h(MenuItem, {}, "A")));
    await wait(40);
    const trig = c.querySelector("button");
    trig.click();
    assert(await until(() => c.querySelector('[role="menu"], [role="menuitem"]') || document.querySelector('[role="menu"]')), "menu");
  });

  await test("Combobox expand", async () => {
    assert(Combobox, "Combobox");
    const c = mount(h(Combobox, { label: "Pick", options: [{ value: "a", label: "Alpha" }] }));
    await wait(40);
    const input = c.querySelector("input, [role=combobox]");
    assert(input, "input");
    input.focus();
    input.dispatchEvent(new Event("focus", { bubbles: true }));
    kd(input, "ArrowDown");
    assert(await until(() => input.getAttribute("aria-expanded") === "true" || c.querySelector('[role="listbox"]')), "expanded");
  });

  await test("DataGrid sort", async () => {
    assert(DataGrid, "DataGrid");
    function GH() {
      const [s, setS] = React.useState([]);
      return h(DataGrid, {
        selectable: true,
        selected: s,
        onSelect: setS,
        columns: [{ key: "n", header: "N", sortable: true }],
        rows: [{ k: "b", n: "Beta" }, { k: "a", n: "Alpha" }],
        rowKey: "k",
      });
    }
    const c = mount(h(GH));
    await wait(40);
    assert(c.querySelector("table, [role=grid], [role=table]"), "grid");
    const sort = c.querySelector(".cs-datagrid__sort");
    if (sort) sort.click();
    assert(await until(() => c.querySelector("th[aria-sort]")), "aria-sort");
  });

  await test("Sortable move", async () => {
    assert(Sortable, "Sortable");
    let items = [{ key: "1", label: "One" }, { key: "2", label: "Two" }];
    function App() {
      const [it, setIt] = React.useState(items);
      items = it;
      return h(Sortable, { items: it, onChange: setIt, lang: "en" });
    }
    const c = mount(h(App));
    await wait(40);
    const live = c.querySelector("[aria-live]");
    const down = c.querySelector('button[aria-label="Move down"]');
    assert(down, "move down");
    down.click();
    assert(await until(() => items.map((i) => i.key).join(",") === "2,1"), "reordered");
    assert(live, "live");
  });

  await test("Editor textbox", async () => {
    assert(Editor, "Editor");
    const c = mount(h(Editor, { defaultValue: "<p>x</p>" }));
    await wait(40);
    assert(c.querySelector('[role="textbox"], [contenteditable], textarea'), "editor");
  });

  await test("Carousel semantics", async () => {
    assert(Carousel, "Carousel");
    const c = mount(h(Carousel, {}, [h("div", { key: 1 }, "S1"), h("div", { key: 2 }, "S2")]));
    await wait(40);
    assert(c.querySelector("[aria-roledescription]") || c.querySelector("[aria-live]"), "carousel");
  });

  await test("DatePicker escape", async () => {
    assert(DatePicker, "DatePicker");
    const c = mount(h(DatePicker, { label: "When", lang: "en" }));
    await wait(40);
    const btn = c.querySelector("button[aria-haspopup=dialog]");
    assert(btn, "field");
    btn.click();
    assert(await until(() => c.querySelector('[role="dialog"]')), "pop");
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    assert(await until(() => !c.querySelector('[role="dialog"]')), "esc");
  });

  await test("TimePicker label", async () => {
    assert(TimePicker, "TimePicker");
    const c = mount(h(TimePicker, { label: "At", value: "09:00", lang: "en" }));
    await wait(40);
    const sel = c.querySelector("select");
    assert(sel && sel.getAttribute("aria-label"), "labeled select");
  });

  await test("IME Combobox composition", async () => {
    assert(Combobox, "Combobox");
    let picked = null;
    const c = mount(h(Combobox, { label: "Pick", options: [{ value: "a", label: "Alpha" }], onChange: (v) => { picked = v; } }));
    await wait(40);
    const input = c.querySelector("[role=combobox]");
    assert(input, "input");
    input.focus();
    input.dispatchEvent(new CompositionEvent("compositionstart", { data: "", bubbles: true }));
    input.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", keyCode: 229, bubbles: true }));
    assert(picked == null, "enter during IME must not commit");
    input.dispatchEvent(new CompositionEvent("compositionend", { data: "nguyễn", bubbles: true }));
    const proto = window.HTMLInputElement.prototype;
    Object.getOwnPropertyDescriptor(proto, "value").set.call(input, "nguyễn");
    input.dispatchEvent(new Event("input", { bubbles: true }));
    assert(input.value.includes("nguyễn") || input.value.length > 0, "composed text kept");
  });

  await test("IME PromptInput composition", async () => {
    assert(PromptInput, "PromptInput");
    let submitted = null;
    const c = mount(h(PromptInput, { onSubmit: (v) => { submitted = v; } }));
    await wait(40);
    const ta = c.querySelector("textarea");
    assert(ta, "textarea");
    ta.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", keyCode: 229, bubbles: true }));
    assert(submitted == null, "enter during IME must not submit");
  });

  await test("Image preview", async () => {
    assert(Image, "Image");
    const c = mount(h(Image, { src: PIXEL, alt: "dot", preview: true, lang: "en" }));
    await until(() => {
      const img = c.querySelector("img");
      if (img && img.complete) img.dispatchEvent(new Event("load", { bubbles: true }));
      return c.querySelector("[aria-haspopup=dialog]");
    }, 3000);
    assert(c.querySelector("[aria-haspopup=dialog]"), "zoomable");
    const host = c.querySelector("[aria-haspopup=dialog]");
    host.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    assert(await until(() => document.querySelector('.cs-image__zoom[role="dialog"]')), "preview");
    assert(c.querySelector("[aria-live]"), "live");
  });

  const p95 = times.length ? times.slice().sort((a, b) => a - b)[Math.max(0, Math.ceil(times.length * 0.95) - 1)] : 0;
  const failed = results.filter((r) => !r.ok);
  window.__highRiskAt = {
    pass: failed.length === 0 && p95 < 100,
    results,
    dialogOpenMs: times,
    dialogOpenP95: p95,
  };
  document.getElementById("sum").textContent = window.__highRiskAt.pass
    ? "PASS " + results.length + " p95=" + p95.toFixed(1) + "ms"
    : "FAIL " + failed.map((f) => f.name).join(", ");
}
run();
</script>
</body></html>
