<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>High-risk AT</title>
<link rel="stylesheet" href="../packages/tokens/dist/tokens.css">
<link rel="stylesheet" href="../packages/themes/dist/high-contrast.css">
<link rel="stylesheet" href="../styles.css">
<script src="../_vendor/react/react.production.min.js"></script>
<script src="../_vendor/react/react-dom.production.min.js"></script>
<script src="../packages/react/dist/stable-global.js"></script>
</head><body>
<main id="main"><p id="sum">running…</p></main>
<div id="stage"></div>
<script>
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const h = React.createElement;
const NS = window.CyberSkillReact || window.CyberSkillDS || window[Object.keys(window).find((k) => /^CyberSkillDesignSystem_[0-9a-f]{6}$/.test(k))];
const stage = document.getElementById("stage");
const results = [];
function mount(el) {
  const c = document.createElement("div");
  stage.appendChild(c);
  ReactDOM.createRoot(c).render(el);
  return c;
}
function assert(c, m) { if (!c) throw new Error(m); }
function kd(t, key) { t.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true })); }
function accName(el) {
  if (!el) return "";
  const labelled = el.getAttribute("aria-labelledby");
  if (labelled) {
    return labelled.split(/\s+/).map((id) => (document.getElementById(id) || {}).textContent || "").join(" ").replace(/\s+/g, " ").trim();
  }
  return (el.getAttribute("aria-label") || el.getAttribute("title") || el.textContent || "").replace(/\s+/g, " ").trim();
}
function spokenPhrase(el, fallbackRole) {
  if (!el) return "";
  const role = el.getAttribute("role") || el.getAttribute("aria-roledescription") || fallbackRole || el.tagName.toLowerCase();
  const name = accName(el);
  const value = el.getAttribute("aria-valuetext") || el.getAttribute("aria-valuenow") || "";
  const live = el.getAttribute("aria-live") ? "live " + el.getAttribute("aria-live") : "";
  return [name, role, value, live].filter(Boolean).join(", ");
}
const PIXEL = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==";
async function until(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 2000)) {
    try { if (fn()) return true; } catch { /* retry */ }
    await wait(40);
  }
  return !!fn();
}
async function test(name, fn) {
  try { await fn(); results.push({ name, ok: true }); }
  catch (e) { results.push({ name, ok: false, detail: String(e.message || e).slice(0, 160) }); }
}
async function run() {
  if (!NS || !NS.Button || !NS.Dialog) {
    window.__highRiskAt = {
      pass: false,
      results: [{ name: "compiled CyberSkillReact", ok: false, detail: "missing window.CyberSkillReact" }],
      dialogOpenP95: 0,
      buttonClickP95: 0,
      textFieldP95: 0,
      ax: [],
      spoken: [],
      package: NS && NS.Button ? "CyberSkillReact" : "missing",
    };
    document.getElementById("sum").textContent = "FAIL compiled CyberSkillReact missing";
    return;
  }
  const {
    Dialog, AlertDialog, Menu, MenuItem, Button, Combobox, DataGrid, Sortable,
    Editor, Carousel, DatePicker, TimePicker, Image, PromptInput, TextField,
  } = NS;
  const times = [];
  const buttonTimes = [];
  const fieldTimes = [];
  let ax = [];
  const spoken = [];

  await test("Dialog keyboard", async () => {
    assert(Dialog, "Dialog");
    function App() {
      const [o, setO] = React.useState(false);
      return h("div", null,
        h("button", { className: "d-trig", onClick: () => setO(true) }, "Open"),
        o ? h(Dialog, { open: true, title: "T", onClose: () => setO(false) }, "body") : null,
      );
    }
    const c = mount(h(App));
    await wait(40);
    for (let i = 0; i < 8; i++) {
      const t0 = performance.now();
      c.querySelector(".d-trig").click();
      assert(await until(() => document.querySelector('[role="dialog"]')), "dialog");
      times.push(performance.now() - t0);
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
      assert(await until(() => !document.querySelector('[role="dialog"]')), "esc");
    }
  });

  await test("Dialog focus restore", async () => {
    function App() {
      const [o, setO] = React.useState(false);
      return h("div", null,
        h("button", { className: "d-restore", onClick: () => setO(true) }, "Open"),
        o ? h(Dialog, { open: true, title: "Restore", onClose: () => setO(false) }, "body") : null,
      );
    }
    const c = mount(h(App));
    await wait(40);
    const trig = c.querySelector(".d-restore");
    trig.focus();
    trig.click();
    assert(await until(() => document.querySelector('[role="dialog"]')), "dialog");
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    assert(await until(() => !document.querySelector('[role="dialog"]')), "esc");
    await wait(40);
    assert(document.activeElement === trig, "focus returned to trigger");
  });

  await test("AlertDialog keyboard", async () => {
    assert(AlertDialog, "AlertDialog");
    function App() {
      const [o, setO] = React.useState(false);
      return h("div", null,
        h("button", { className: "a-trig", onClick: () => setO(true) }, "Open"),
        o ? h(AlertDialog, { open: true, title: "Del", description: "Sure", onOpenChange: setO, onConfirm: () => {} }) : null,
      );
    }
    const c = mount(h(App));
    await wait(40);
    const trig = c.querySelector(".a-trig");
    assert(trig, "trigger");
    trig.focus();
    trig.click();
    assert(await until(() => document.querySelector('[role="alertdialog"], [role="dialog"]')), "alert");
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    assert(await until(() => !document.querySelector('[role="alertdialog"]')), "esc");
    await wait(40);
    assert(document.activeElement === trig, "alert focus restored");
  });

  await test("Menu keyboard", async () => {
    assert(Menu && MenuItem && Button, "Menu");
    const c = mount(h(Menu, { trigger: h(Button, { size: "sm" }, "Open") }, h(MenuItem, {}, "A")));
    await wait(40);
    const trig = c.querySelector("button");
    trig.focus();
    trig.click();
    assert(await until(() => c.querySelector('[role="menu"], [role="menuitem"]') || document.querySelector('[role="menu"]')), "menu");
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    assert(await until(() => !document.querySelector('[role="menu"]')), "menu esc");
    await wait(40);
    assert(document.activeElement === trig, "menu focus restored");
  });

  await test("Combobox expand", async () => {
    assert(Combobox, "Combobox");
    const c = mount(h(Combobox, { label: "Pick", options: [{ value: "a", label: "Alpha" }] }));
    await wait(40);
    const input = c.querySelector("input, [role=combobox]");
    assert(input, "input");
    input.focus();
    input.dispatchEvent(new Event("focus", { bubbles: true }));
    kd(input, "ArrowDown");
    assert(await until(() => input.getAttribute("aria-expanded") === "true" || c.querySelector('[role="listbox"]')), "expanded");
  });

  await test("DataGrid sort", async () => {
    assert(DataGrid, "DataGrid");
    function GH() {
      const [s, setS] = React.useState([]);
      return h(DataGrid, {
        selectable: true,
        selected: s,
        onSelect: setS,
        columns: [{ key: "n", header: "N", sortable: true }],
        rows: [{ k: "b", n: "Beta" }, { k: "a", n: "Alpha" }],
        rowKey: "k",
      });
    }
    const c = mount(h(GH));
    await wait(40);
    assert(c.querySelector("table, [role=grid], [role=table]"), "grid");
    const sort = c.querySelector(".cs-datagrid__sort");
    if (sort) sort.click();
    assert(await until(() => c.querySelector("th[aria-sort]")), "aria-sort");
  });

  await test("Sortable move", async () => {
    assert(Sortable, "Sortable");
    let items = [{ key: "1", label: "One" }, { key: "2", label: "Two" }];
    function App() {
      const [it, setIt] = React.useState(items);
      items = it;
      return h(Sortable, { items: it, onChange: setIt, lang: "en" });
    }
    const c = mount(h(App));
    await wait(40);
    const live = c.querySelector("[aria-live]");
    const down = c.querySelector('button[aria-label="Move down"]');
    assert(down, "move down");
    down.click();
    assert(await until(() => items.map((i) => i.key).join(",") === "2,1"), "reordered");
    assert(live, "live");
    assert(await until(() => (live.textContent || "").trim().length > 0), "live announced move");
  });

  await test("Button click p95", async () => {
    assert(Button, "Button");
    let n = 0;
    const c = mount(h(Button, { onClick: () => { n += 1; } }, "Go"));
    await wait(40);
    const btn = c.querySelector("button");
    for (let i = 0; i < 8; i++) {
      const t0 = performance.now();
      btn.click();
      buttonTimes.push(performance.now() - t0);
    }
    assert(n === 8 && buttonTimes.length === 8, "clicks");
  });

  await test("TextField input p95", async () => {
    assert(TextField, "TextField");
    const c = mount(h(TextField, { label: "Task id" }));
    await wait(40);
    const input = c.querySelector("input");
    assert(input, "input");
    for (let i = 0; i < 8; i++) {
      const t0 = performance.now();
      input.focus();
      input.value = "TASK-" + i;
      input.dispatchEvent(new Event("input", { bubbles: true }));
      fieldTimes.push(performance.now() - t0);
    }
    assert(input.value.includes("TASK") && fieldTimes.length === 8, "value");
  });

  await test("Editor textbox", async () => {
    assert(Editor, "Editor");
    const c = mount(h(Editor, { defaultValue: "<p>x</p>" }));
    await wait(40);
    assert(c.querySelector('[role="textbox"], [contenteditable], textarea'), "editor");
  });

  await test("Carousel semantics", async () => {
    assert(Carousel, "Carousel");
    const c = mount(h(Carousel, {}, [h("div", { key: 1 }, "S1"), h("div", { key: 2 }, "S2")]));
    await wait(40);
    assert(c.querySelector("[aria-roledescription]") || c.querySelector("[aria-live]"), "carousel");
  });

  await test("DatePicker escape", async () => {
    assert(DatePicker, "DatePicker");
    const c = mount(h(DatePicker, { label: "When", lang: "en" }));
    await wait(40);
    const btn = c.querySelector("button[aria-haspopup=dialog]");
    assert(btn, "field");
    btn.click();
    assert(await until(() => c.querySelector('[role="dialog"]')), "pop");
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    assert(await until(() => !c.querySelector('[role="dialog"]')), "esc");
  });

  await test("TimePicker label", async () => {
    assert(TimePicker, "TimePicker");
    const c = mount(h(TimePicker, { label: "At", value: "09:00", lang: "en" }));
    await wait(40);
    const sel = c.querySelector("select");
    assert(sel && sel.getAttribute("aria-label"), "labeled select");
  });

  await test("IME Combobox composition", async () => {
    assert(Combobox, "Combobox");
    let picked = null;
    const c = mount(h(Combobox, { label: "Pick", options: [{ value: "a", label: "Alpha" }], onChange: (v) => { picked = v; } }));
    await wait(40);
    const input = c.querySelector("[role=combobox]");
    assert(input, "input");
    input.focus();
    input.dispatchEvent(new CompositionEvent("compositionstart", { data: "", bubbles: true }));
    input.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", keyCode: 229, bubbles: true }));
    assert(picked == null, "enter during IME must not commit");
    input.dispatchEvent(new CompositionEvent("compositionend", { data: "nguyễn", bubbles: true }));
    const proto = window.HTMLInputElement.prototype;
    Object.getOwnPropertyDescriptor(proto, "value").set.call(input, "nguyễn");
    input.dispatchEvent(new Event("input", { bubbles: true }));
    assert(input.value.includes("nguyễn") || input.value.length > 0, "composed text kept");
  });

  await test("IME PromptInput composition", async () => {
    assert(PromptInput, "PromptInput");
    let submitted = null;
    const c = mount(h(PromptInput, { onSubmit: (v) => { submitted = v; } }));
    await wait(40);
    const ta = c.querySelector("textarea");
    assert(ta, "textarea");
    ta.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", keyCode: 229, bubbles: true }));
    assert(submitted == null, "enter during IME must not submit");
  });

  await test("Image preview", async () => {
    assert(Image, "Image");
    const c = mount(h(Image, { src: PIXEL, alt: "dot", preview: true, lang: "en" }));
    await until(() => {
      const img = c.querySelector("img");
      if (img && img.complete) img.dispatchEvent(new Event("load", { bubbles: true }));
      return c.querySelector("[aria-haspopup=dialog]");
    }, 3000);
    assert(c.querySelector("[aria-haspopup=dialog]"), "zoomable");
    const host = c.querySelector("[aria-haspopup=dialog]");
    host.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    assert(await until(() => document.querySelector('.cs-image__zoom[role="dialog"]')), "preview");
    assert(c.querySelector("[aria-live]"), "live");
  });

  await test("AT name/role/value", async () => {
    const gallery = document.createElement("div");
    gallery.id = "ax-gallery";
    stage.appendChild(gallery);
    function gmount(el) {
      const c = document.createElement("div");
      gallery.appendChild(c);
      ReactDOM.createRoot(c).render(el);
      return c;
    }
    function record(surface, el, fallbackRole, nameHint) {
      assert(el, surface + " missing");
      const role = el.getAttribute("role") || el.getAttribute("aria-roledescription") || fallbackRole || el.tagName.toLowerCase();
      const name = accName(el);
      assert(role, surface + " role");
      if (nameHint !== "optional-name") {
        assert(name.length, surface + " accessible name");
      }
      if (nameHint && nameHint !== "optional-name") {
        assert(name.toLowerCase().includes(String(nameHint).toLowerCase()), surface + " name expected " + nameHint + " got " + name);
      }
      ax.push({ surface, role, name: name.slice(0, 80) });
      spoken.push({ surface, phrase: spokenPhrase(el, fallbackRole) });
    }

    const d = gmount(h(Dialog, { open: true, title: "Dialog title", onClose: () => {} }, "body"));
    await wait(40);
    record("Dialog", d.querySelector('[role="dialog"]'), "dialog", "Dialog title");

    const a = gmount(h(AlertDialog, { open: true, title: "Del", description: "Sure", onOpenChange: () => {}, onConfirm: () => {} }));
    await wait(40);
    record("AlertDialog", a.querySelector('[role="alertdialog"]'), "alertdialog", "Del");

    const m = gmount(h(Menu, { trigger: h(Button, { size: "sm" }, "Open menu") }, h(MenuItem, {}, "Alpha item")));
    await wait(40);
    m.querySelector("button").click();
    assert(await until(() => m.querySelector('[role="menu"]')), "menu");
    record("Menu", m.querySelector('[role="menu"]'), "menu");
    record("MenuItem", m.querySelector('[role="menuitem"]'), "menuitem", "Alpha");

    const cb = gmount(h(Combobox, { label: "Pick", options: [{ value: "a", label: "Alpha" }] }));
    await wait(40);
    record("Combobox", cb.querySelector("[role=combobox]"), "combobox", "Pick");

    const dg = gmount(h(DataGrid, {
      columns: [{ key: "n", header: "Name", sortable: true }],
      rows: [{ k: "1", n: "Row" }],
      rowKey: "k",
    }));
    await wait(40);
    record("DataGrid", dg.querySelector("table, [role=grid], [role=table]"), "table", "optional-name");

    const so = gmount(h(Sortable, {
      items: [{ key: "1", label: "One" }, { key: "2", label: "Two" }],
      onChange: () => {},
      lang: "en",
    }));
    await wait(40);
    record("Sortable", so.querySelector('button[aria-label="Move down"]'), "button", "Move down");

    const ed = gmount(h(Editor, { defaultValue: "<p>x</p>" }));
    await wait(40);
    record("Editor", ed.querySelector('[role="textbox"]'), "textbox");

    const car = gmount(h(Carousel, { label: "Gallery" }, [h("div", { key: 1 }, "S1"), h("div", { key: 2 }, "S2")]));
    await wait(40);
    record("Carousel", car.querySelector("[aria-roledescription]"), "region", "Gallery");

    const dp = gmount(h(DatePicker, { label: "When", lang: "en" }));
    await wait(40);
    const dpb = dp.querySelector("button[aria-haspopup=dialog]");
    record("DatePicker", dpb, "button", "When");
    dpb.click();
    assert(await until(() => dp.querySelector('[role="dialog"]')), "date dialog");
    record("DatePickerDialog", dp.querySelector('[role="dialog"]'), "dialog", "When");

    const tp = gmount(h(TimePicker, { label: "At", value: "09:00", lang: "en" }));
    await wait(40);
    record("TimePicker", tp.querySelector("select"), "combobox", "At");

    const im = gmount(h(Image, { src: PIXEL, alt: "dot", preview: true, lang: "en" }));
    await until(() => {
      const img = im.querySelector("img");
      if (img && img.complete) img.dispatchEvent(new Event("load", { bubbles: true }));
      return im.querySelector("[aria-haspopup=dialog]");
    }, 3000);
    const host = im.querySelector("[aria-haspopup=dialog]");
    host.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    assert(await until(() => im.querySelector('.cs-image__zoom[role="dialog"]')), "img dialog");
    record("Image", im.querySelector('.cs-image__zoom[role="dialog"]'), "dialog", "dot");

    const required = [
      "Dialog", "AlertDialog", "Menu", "MenuItem", "Combobox", "DataGrid",
      "Sortable", "Editor", "Carousel", "DatePicker", "DatePickerDialog",
      "TimePicker", "Image",
    ];
    for (const s of required) assert(ax.some((x) => x.surface === s), "missing AX " + s);
  });

  function p95of(arr) {
    if (!arr.length) return 0;
    const s = arr.slice().sort((a, b) => a - b);
    return s[Math.max(0, Math.ceil(s.length * 0.95) - 1)];
  }
  const p95 = p95of(times);
  const buttonP95 = p95of(buttonTimes);
  const fieldP95 = p95of(fieldTimes);
  document.documentElement.setAttribute("data-cs-contrast", "high");
  const highContrastText = getComputedStyle(document.documentElement).getPropertyValue("--cs-color-text-primary").trim();
  document.documentElement.removeAttribute("data-cs-contrast");
  const contrastOk = highContrastText.length > 0;
  const failed = results.filter((r) => !r.ok);
  const spokenOk = [
    ["Dialog", /dialog title/i],
    ["AlertDialog", /del/i],
    ["MenuItem", /alpha/i],
    ["Combobox", /pick/i],
    ["Sortable", /move down/i],
    ["Carousel", /gallery/i],
    ["DatePickerDialog", /when/i],
    ["Image", /dot/i],
  ].every(([surface, re]) => spoken.some((row) => row.surface === surface && re.test(row.phrase)));
  window.__highRiskAt = {
    pass: failed.length === 0 && p95 < 100 && buttonP95 < 100 && fieldP95 < 100 && spokenOk && contrastOk,
    results,
    dialogOpenMs: times,
    dialogOpenP95: p95,
    buttonClickP95: buttonP95,
    textFieldP95: fieldP95,
    ax,
    spoken,
    highContrastText,
    package: "CyberSkillReact",
  };
  document.getElementById("sum").textContent = window.__highRiskAt.pass
    ? "PASS " + results.length + " p95=" + p95.toFixed(1) + "ms ax=" + ax.length + " spoken=" + spoken.length
    : "FAIL " + failed.map((f) => f.name).join(", ");
}
run();
</script>
</body></html>
