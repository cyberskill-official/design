<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CyberSkill — docs Storybook coverage</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--cs-font-family-ui,system-ui);background:#efe6d8;color:#231a12;padding:16px 20px}
  h1{font-size:16px;margin:0 0 2px}
  .lede{color:#6b5d4f;max-width:920px;line-height:1.5;margin:0 0 14px;font-size:13px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:6px;font:12.5px ui-monospace,monospace;max-width:960px;margin-bottom:2px}
  .row.ok{background:#dcfce7;color:#166534}.row.bad{background:#FEE2E2;color:#B42318;font-weight:700}
  #sum{font-size:15px;font-weight:800;margin:12px 0}
</style></head><body>
<h1>Docs Storybook coverage</h1>
<p class="lede">Every tracked operator doc, entrance file, and doctrine page must appear in the Storybook Docs sidebar and in <code>docs/viewer.html</code>. Storybook must publish <code>docs/</code> via <code>staticDirs</code> and entrance files at <code>/</code>. Verdict on <code>window.__docssbcoverage</code>.</p>
<div id="list"></div>
<div id="sum">running…</div>
<script>
const P=window.__gateProgress={done:0,total:1,current:'boot'};
const list=document.getElementById('list');
function row(ok,t){ const d=document.createElement('div'); d.className='row '+(ok?'ok':'bad'); d.innerHTML='<span>'+(ok?'\u2713 ':'\u2717 ')+t+'</span>'; list.appendChild(d); }
function publish(v){ if(window.__docssbcoverage) return; window.__docssbcoverage=v; const s=document.getElementById('sum'); s.textContent=v.pass?('\u2713 '+v.stories+' stories \u00b7 '+v.docs+' docs'):('\u2717 '+(v.error||v.problems.length+' violations')); s.style.color=v.pass?'#166534':'#B42318'; console.log('DOCSSBCOVERAGE VERDICT '+JSON.stringify({pass:v.pass,docs:v.docs,stories:v.stories,problems:(v.problems||[]).slice(0,10),error:v.error||null})); }
async function fetchRaw(path){
  const r=await fetch('../'+path,{cache:'no-store'});
  const t=await r.text();
  if(!r.ok) return {ok:false,text:'',err:'HTTP '+r.status};
  if(/^\s*<(!doctype|html)/i.test(t) && !path.endsWith('.html')) return {ok:false,text:'',err:'got HTML (hosting intercept)'};
  return {ok:true,text:t,err:null};
}
(async()=>{
  const problems=[];
  const catR=await fetchRaw('_audit/docs-catalog.json');
  if(!catR.ok) throw new Error('docs-catalog.json '+catR.err);
  const catalog=JSON.parse(catR.text);
  const trackedR=await fetchRaw('_audit/docs-tracked.json');
  if(!trackedR.ok) throw new Error('docs-tracked.json '+trackedR.err);
  const tracked=JSON.parse(trackedR.text).tracked||[];
  const catalogPaths=new Set([...(catalog.entrance||[]).map(p=>p.path), ...(catalog.pages||[]).map(p=>p.path)]);
  const catalogStories=new Set([...(catalog.entrance||[]).map(p=>p.story), ...(catalog.pages||[]).map(p=>p.story), ...(catalog.curated||[]).map(p=>p.story)]);
  for(const name of tracked){
    if(!catalogPaths.has('docs/'+name)) problems.push('tracked '+name+' missing from catalog');
  }
  if(!catalogPaths.has('docs/doctrine.md')) problems.push('doctrine.md missing from catalog');
  const viewerR=await fetchRaw('docs/viewer.html');
  if(!viewerR.ok) throw new Error('viewer '+viewerR.err);
  const viewerSet=new Set([...(viewerR.text.matchAll(/\['([^']+\.(?:md|txt))'/g)||[])].map(m=>m[1]));
  for(const path of catalogPaths){
    if(!viewerSet.has(path)) problems.push('viewer nav missing '+path);
  }
  const storyFiles=new Set([
    'stories/Docs/StartPages.stories.jsx','stories/Docs/GuidePages.stories.jsx','stories/Docs/MaintainerPages.stories.jsx',
    ...(catalog.pages||[]).filter(p=>p.mdx).map(p=>p.mdx),
    ...(catalog.curated||[]).filter(p=>p.mdx).map(p=>p.mdx),
  ]);
  let storyBlob='';
  for(const f of storyFiles){
    const r=await fetchRaw(f);
    if(!r.ok){ problems.push('missing story file '+f); continue; }
    storyBlob+=r.text+'\n';
  }
  const GROUPS=['Docs/Start','Docs/Guides','Docs/Maintainers','Release Notes'];
  function covered(title){
    if(storyBlob.includes('<Meta title="'+title+'" />')) return true;
    for(const group of GROUPS){
      if(!title.startsWith(group+'/')) continue;
      const leaf=title.slice(group.length+1);
      if(storyBlob.includes("title: '"+group+"'") && storyBlob.includes("name: '"+leaf+"'")) return true;
    }
    return false;
  }
  for(const t of catalogStories){
    if(!covered(t)) problems.push('Storybook missing title '+t);
  }
  const mainR=await fetchRaw('.storybook/main.js');
  if(!mainR.ok) throw new Error('main.js '+mainR.err);
  if(!/from:\s*['"]\.\.\/docs['"]/.test(mainR.text) && !/to:\s*['"]\/docs['"]/.test(mainR.text)) problems.push('staticDirs missing docs/');
  for(const ent of ['README.md','SKILL.md','llms.txt','CONTRIBUTING.md']){
    if(!mainR.text.includes("'/"+ent+"'") && !mainR.text.includes('"/'+ent+'"')) problems.push('plugin missing /'+ent);
  }
  const prevR=await fetchRaw('.storybook/preview.jsx');
  if(!prevR.ok) throw new Error('preview '+prevR.err);
  for(const n of ['Start','Guides','Maintainers','Library','Doctrine']){
    if(!prevR.text.includes("'"+n+"'")) problems.push('storySort missing '+n);
  }
  P.done=1;
  row(problems.length===0, problems.length+' violations');
  problems.slice(0,40).forEach(p=>row(false,p));
  publish({pass:problems.length===0,docs:catalogPaths.size,stories:catalogStories.size,problems});
})().catch(e=>publish({pass:false,docs:0,stories:0,problems:[],error:String(e&&e.message||e).slice(0,160)}));
setTimeout(()=>{ if(!window.__docssbcoverage) publish({pass:false,docs:0,stories:0,problems:[],error:'watchdog'}); },60000);
</script></body></html>
